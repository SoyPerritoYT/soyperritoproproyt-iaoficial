/* ===============================
   MATEMÁTICAS
================================ */

function calcular(texto){

let t=texto.toLowerCase().trim();

/* "suma 5 y 8" */

let suma=t.match(
/sum(?:a|ar)\s+(-?\d+(?:[.,]\d+)?)\s+(?:y|con)\s+(-?\d+(?:[.,]\d+)?)/i
);

if(suma){

let a=Number(suma[1].replace(",","."));
let b=Number(suma[2].replace(",","."));

return a+b;
}


/* "resta 20 y 7" */

let resta=t.match(
/rest(?:a|ar)\s+(-?\d+(?:[.,]\d+)?)\s+(?:y|a)\s+(-?\d+(?:[.,]\d+)?)/i
);

if(resta){

let a=Number(resta[1].replace(",","."));
let b=Number(resta[2].replace(",","."));

return a-b;
}


/* "multiplica 6 por 9" */

let multi=t.match(
/multiplic(?:a|ar)\s+(-?\d+(?:[.,]\d+)?)\s+(?:por|x)\s+(-?\d+(?:[.,]\d+)?)/i
);

if(multi){

let a=Number(multi[1].replace(",","."));
let b=Number(multi[2].replace(",","."));

return a*b;
}


/* Operaciones normales */

t=t
.replace(/×/g,"*")
.replace(/x/g,"*")
.replace(/÷/g,"/")
.replace(/,/g,".")
.trim();

if(!/^[0-9+\-*/().\s]+$/.test(t))
return null;

if(!/[+\-*/]/.test(t))
return null;

try{

let resultado=Function(
'"use strict";return ('+t+')'
)();

if(
typeof resultado!=="number"||
!Number.isFinite(resultado)
)
return null;

return resultado;

}catch(e){

return null;
}

}
