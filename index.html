<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoyPerritoProProYT.IAOFICIAL</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;display:flex;justify-content:center;min-height:100vh}.app{width:min(720px,100%);display:flex;flex-direction:column;height:100vh;background:#181818}.top{padding:18px;text-align:center;background:#242424;border-bottom:1px solid #333}.top h1{margin:0;font-size:22px}.status{font-size:13px;color:#aaa;margin-top:6px}.chat{flex:1;overflow:auto;padding:16px}.msg{max-width:85%;padding:11px 14px;border-radius:14px;margin:8px 0;white-space:pre-wrap;line-height:1.4}.user{margin-left:auto;background:#315efb}.ai{margin-right:auto;background:#292929}.form{display:flex;gap:8px;padding:12px;background:#242424;border-top:1px solid #333}.form input{flex:1;padding:13px;border:0;border-radius:12px;background:#333;color:#fff;outline:0}.form button{border:0;border-radius:12px;padding:0 18px;background:#fff;color:#111;font-weight:bold;cursor:pointer}.form button:disabled{opacity:.5}.hint{text-align:center;color:#777;font-size:12px;padding-bottom:8px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>🐶 SoyPerritoProProYT.IAOFICIAL</h1>
    <div class="status" id="estado">Listo para chatear</div>
  </header>
  <main class="chat" id="chat"></main>
  <div class="hint">Escribe un mensaje y pulsa Enviar o Enter.</div>
  <form class="form" id="form">
    <input id="entrada" type="text" placeholder="Escribe algo..." autocomplete="off" maxlength="4000">
    <button id="enviar" type="submit">Enviar</button>
  </form>
</div>
<script>
const chat=document.getElementById('chat');
const entrada=document.getElementById('entrada');
const form=document.getElementById('form');
const enviarBtn=document.getElementById('enviar');
const estado=document.getElementById('estado');
const historial=[];
function mensaje(texto,tipo){const el=document.createElement('div');el.className='msg '+tipo;el.textContent=texto;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el;}
mensaje('¡Hola! 🐶 Soy tu IA. Escríbeme algo para empezar.','ai');
async function enviar(){
 const texto=entrada.value.trim();
 if(!texto)return;
 entrada.value='';
 mensaje(texto,'user');
 historial.push({role:'user',content:texto});
 enviarBtn.disabled=true;entrada.disabled=true;estado.textContent='Pensando...';
 const espera=mensaje('Escribiendo...','ai');
 try{
   const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:texto,history:historial.slice(-12)})});
   const data=await r.json().catch(()=>({}));
   if(!r.ok)throw new Error(data.error||'No se pudo conectar con la API.');
   espera.textContent=data.reply||'La IA no devolvió una respuesta.';
   if(data.reply)historial.push({role:'assistant',content:data.reply});
   estado.textContent='API conectada';
 }catch(e){
   espera.textContent='❌ '+e.message+'\n\nSi estás usando GitHub Pages, recuerda que /api/chat necesita estar desplegado en un servidor compatible.';
   estado.textContent='API no disponible';
 }finally{
   enviarBtn.disabled=false;entrada.disabled=false;entrada.focus();
 }
}
form.addEventListener('submit',e=>{e.preventDefault();enviar();});
</script>
</body>
</html>
