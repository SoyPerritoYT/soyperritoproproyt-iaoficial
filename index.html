<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoyPerritoProProYT.IAOFICIAL</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101012;color:#fff;font-family:Arial,sans-serif}
.app{width:min(820px,100%);min-height:100vh;margin:auto;background:#18181b;display:flex;flex-direction:column}
.top{padding:18px;text-align:center;background:#242428;border-bottom:1px solid #333}.top h1{margin:0;font-size:22px}.status{margin-top:6px;color:#aaa;font-size:13px}
.auth,.chatbar,.tools,.form{padding:10px 12px;background:#202024;border-bottom:1px solid #333;display:flex;gap:8px;flex-wrap:wrap}
.auth input,.form input,.tools input,.tools textarea,.tools select,.chatbar select{padding:11px;border:0;border-radius:10px;background:#333;color:#fff}
.auth input{flex:1;min-width:130px}.chatbar select{flex:1;min-width:0}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
.msginfo{width:100%;font-size:12px;color:#aaa;white-space:pre-wrap}.chat{flex:1;min-height:280px;padding:16px;overflow:auto}
.msg{max-width:85%;padding:11px 14px;margin:8px 0;border-radius:14px;white-space:pre-wrap;line-height:1.4}.user{margin-left:auto;background:#315efb}.ai{margin-right:auto;background:#29292e}
.form{background:#242428;border-top:1px solid #333;border-bottom:0}.form input{flex:1;min-width:0}.form button{background:#fff;color:#111}
.media{padding:14px;background:#111113;border-top:1px solid #333}.media video,.media img{display:block;max-width:100%;margin:auto;border-radius:12px}.media video{width:min(100%,760px);max-height:520px;background:#000}
.panel{width:100%;display:grid;gap:8px}.panel textarea{width:100%;font-family:monospace}.hint{text-align:center;color:#777;font-size:12px;padding:8px}
@media(max-width:560px){.auth input,.auth button,.tools button,.tools input,.tools textarea,.tools select{width:100%}}

.pcbox{padding:14px;background:#0c0c0f;border-top:1px solid #333}
.pcbox iframe{display:block;width:100%;height:min(70vh,720px);min-height:420px;border:0;border-radius:12px;background:#000}
.pcbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.pcbar input{flex:1;min-width:180px}
.pcbar input,.pcbar button{padding:10px;border-radius:10px;border:0;background:#333;color:#fff}.pcout{white-space:pre-wrap;color:#aaa;font:12px monospace;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<header class="top"><h1>🐶 SoyPerritoProProYT.IAOFICIAL</h1><div class="status" id="estado">💬 Modo invitado · puedes hablar sin cuenta</div></header>

<div class="auth">
<input id="userName" placeholder="Nombre de usuario" maxlength="30" autocomplete="username">
<input id="userPass" type="password" placeholder="Contraseña (6+ caracteres)" maxlength="100" autocomplete="current-password">
<button id="registerBtn">🆕 Crear cuenta</button><button id="loginBtn">🔐 Iniciar sesión</button><button id="logoutBtn" hidden>🚪 Cerrar sesión</button>
<div id="authMsg" class="msginfo"></div>
</div>

<div class="chatbar"><select id="chatSelect"><option>💬 Inicia sesión para ver tus chats</option></select><button id="nuevoChatBtn">➕ Nuevo chat</button></div>
<main id="chat" class="chat"></main>
<div class="hint">💬 Puedes hablar con la IA sin cuenta. 💾 Con cuenta, tus chats se guardan en este dispositivo.</div>

<div class="tools">
<textarea id="videoPrompt" rows="3" maxlength="2000" placeholder="✍️ Escribe qué vídeo quieres crear..."></textarea>
<button id="randomVideoBtn">🎲 Idea</button><button id="generateVideoBtn">🎬 Generar vídeo</button>
<div id="videoGeneratorMsg" class="msginfo"></div>
</div>

<div class="tools"><button id="imagenBtn">🖼️ Crear imagen</button></div><div class="tools">
<button id="worldBtn">🌍 Crear mundo de Minecraft</button>
<div id="worldPanel" class="panel" hidden>
<select id="worldEdition"><option value="bedrock">🟩 Minecraft Bedrock (.mcworld)</option><option value="java">🟫 Minecraft Java (.zip)</option></select>
<input id="worldName" maxlength="80" placeholder="Nombre del mundo">
<input id="worldSeed" maxlength="30" placeholder="Semilla (opcional)">
<select id="worldMode"><option value="survival">🎮 Supervivencia</option><option value="creative">🧱 Creativo</option></select>
<textarea id="worldPrompt" rows="4" maxlength="2000" placeholder="Describe tu mundo: por ejemplo, una isla con un castillo y una aldea..."></textarea>
<button id="worldCreateBtn">✨ Generar mundo</button>
<div id="worldMsg" class="msginfo"></div>
</div>
</div>

<div class="tools">
<button id="pcBtn">💻 Abrir PC Digital</button>
<div id="pcPanel" class="pcbox" hidden>
<div class="pcbar">
<input id="pcInstruction" maxlength="500" placeholder="Escribe qué quieres hacer en el PC...">
<button id="pcSendBtn">▶️ Ejecutar</button>
<button id="pcRefreshBtn">🔄 Reiniciar vista</button>
</div>
<iframe id="pcFrame" title="PC Digital"></iframe>
<div id="pcOut" class="pcout"></div>
</div>
</div>
<div id="mediaResult" class="media"></div>

<div class="tools">
<button id="openaiAppBtn">🤖 Crear aplicación con OpenAI</button>
<div id="openaiAppPanel" class="panel" hidden>
<input id="openaiAppName" maxlength="80" placeholder="Nombre de la aplicación">
<textarea id="openaiAppPrompt" rows="4" maxlength="4000" placeholder="Describe qué quieres que haga..."></textarea>
<div><button id="openaiCreateBtn">✨ Crear aplicación</button> <button id="openaiDownloadBtn" disabled>⬇️ Descargar HTML</button></div>
<textarea id="openaiAppCode" rows="14" placeholder="Aquí aparecerá el código..."></textarea>
<div id="openaiAppMsg" class="msginfo"></div>
</div>
</div>

<div class="tools">
<button id="youtubeConnectBtn">▶️ Conectar YouTube</button><button id="youtubeUploadBtn" disabled>⬆️ Enviar/subir vídeo a YouTube</button>
<input id="youtubeTitle" maxlength="100" placeholder="Título del vídeo">
<textarea id="youtubeDescription" rows="2" maxlength="5000" placeholder="Descripción"></textarea>
<select id="youtubePrivacy"><option value="private">🔒 Privado</option><option value="unlisted">🔗 Oculto</option><option value="public">🌍 Público</option></select>
<div id="youtubeMsg" class="msginfo"></div>
</div>

<form id="form" class="form"><input id="entrada" maxlength="4000" autocomplete="off" placeholder="Escribe algo..."><button id="enviar">Enviar</button></form>
</div>

<script src="https://js.puter.com/v2/"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
let usuarioActual=null,nombreActual='',chats=[],chatId='',historial=[],ultimaOpenAIApp='',ultimoVideoUrl='',youtubeAccessToken=null,youtubeClient=null;
const YOUTUBE_CLIENT_ID='954824229147-uf1pv1ch0v052lv0tutaueb1nknc7j19.apps.googleusercontent.com';
const YOUTUBE_SCOPE='https://www.googleapis.com/auth/youtube.upload';

function safeGet(k,f=''){try{return localStorage.getItem(k)??f}catch{return f}}
function safeSet(k,v){try{localStorage.setItem(k,v);return true}catch{return false}}
function safeRemove(k){try{localStorage.removeItem(k)}catch{}}
function norm(v){return String(v||'').trim().toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,30)}
async function api(url,opt={}){const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error del servidor.');return d}
function msg(t,r='ai'){const e=document.createElement('div');e.className='msg '+r;e.textContent=t;$('chat').appendChild(e);$('chat').scrollTop=$('chat').scrollHeight;return e}
function render(){ $('chat').innerHTML=''; if(!historial.length)msg('¡Hola! 🐶 Tus chats se guardan automáticamente en este dispositivo.'); else historial.forEach(m=>msg(m.content,m.role==='user'?'user':'ai'));$('chat').scrollTop=$('chat').scrollHeight }

function accounts(){try{const x=JSON.parse(safeGet('sp_accounts_v1','{}'));return x&&typeof x==='object'&&!Array.isArray(x)?x:{}}catch{return {}}}
async function hashPassword(p){const b=new TextEncoder().encode(p);if(crypto?.subtle){const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=2166136261;for(const x of b){h^=x;h=Math.imul(h,16777619)}return 'fallback-'+(h>>>0).toString(16)}
async function auth(action){
 $('authMsg').textContent='';const u=norm($('userName').value),p=$('userPass').value;
 if(u.length<3)return $('authMsg').textContent='❌ El usuario debe tener al menos 3 caracteres.';
 if(p.length<6)return $('authMsg').textContent='❌ La contraseña debe tener al menos 6 caracteres.';
 try{const a=accounts(),h=await hashPassword(p);
  if(action==='register'){if(a[u])return $('authMsg').textContent='❌ Ese nombre ya existe.';a[u]={hash:h,createdAt:Date.now()};if(!safeSet('sp_accounts_v1',JSON.stringify(a)))throw Error('No se pudo guardar la cuenta.')}
  else if(!a[u]||a[u].hash!==h)return $('authMsg').textContent='❌ Nombre o contraseña incorrectos.';
  safeSet('sp_session_v1',u);activar(u);
 }catch(e){$('authMsg').textContent='❌ '+e.message}
}
function activar(u){usuarioActual=u;nombreActual=u;$('userName').value=u;$('userName').disabled=true;$('userPass').value='';$('registerBtn').hidden=true;$('loginBtn').hidden=true;$('logoutBtn').hidden=false;$('estado').textContent='🟢 '+u+' · chats guardados';cargarChats()}
function cerrarSesion(){safeRemove('sp_session_v1');usuarioActual=null;nombreActual='Invitado';chats=[];chatId='';historial=[];$('userName').disabled=false;$('userName').value='';$('userPass').value='';$('registerBtn').hidden=false;$('loginBtn').hidden=false;$('logoutBtn').hidden=true;$('estado').textContent='💬 Modo invitado · puedes seguir hablando sin cuenta';cargarChats()}
function chatKey(){return usuarioActual?'sp_chats_'+usuarioActual:'sp_guest_chat'}
function cargarChats(){try{chats=JSON.parse(safeGet(chatKey(),'[]'));if(!Array.isArray(chats))chats=[]}catch{chats=[]}if(!chats.length){chats=[{id:'chat-'+Date.now(),title:'Nuevo chat',messages:[]}];guardarChats()}chatId=chats[0].id;selectChats();cargarActual()}
function guardarChats(){safeSet(chatKey(),JSON.stringify(chats.slice(0,30).map(c=>({id:c.id,title:c.title,messages:c.messages.slice(-80)}))))}
function selectChats(){$('chatSelect').innerHTML='';chats.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent='💬 '+c.title;$('chatSelect').appendChild(o)});$('chatSelect').value=chatId}
function cargarActual(){const c=chats.find(x=>x.id===chatId);historial=Array.isArray(c?.messages)?c.messages.slice(-80):[];render()}
function guardar(){const c=chats.find(x=>x.id===chatId);if(!c)return;c.messages=historial.slice(-80);const f=historial.find(x=>x.role==='user');if(f&&c.title==='Nuevo chat')c.title=f.content.slice(0,50)||'Nuevo chat';guardarChats();selectChats()}
function nuevo(){const id='chat-'+Date.now();chats.unshift({id,title:'Nuevo chat',messages:[]});chatId=id;historial=[];guardarChats();selectChats();render()}

async function enviar(){const t=$('entrada').value.trim();if(!t)return;$('entrada').value='';historial.push({role:'user',content:t});render();guardar();$('enviar').disabled=true;$('entrada').disabled=true;const e=msg('Escribiendo...');
try{const d=await api('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});e.textContent=d.reply||'Sin respuesta.';if(d.reply)historial.push({role:'assistant',content:d.reply});guardar()}catch(x){e.textContent='❌ '+x.message}finally{$('enviar').disabled=false;$('entrada').disabled=false}}

const ideas=['Un perrito gamer blanco gana una carrera de karts futurista.','Un perrito descubre una sala secreta llena de máquinas arcade.','Un perrito gamer lucha contra un robot gigante en una arena digital.','Un perrito viaja al espacio en una nave llena de videojuegos.'];
function generarIdea(){$('videoPrompt').value=ideas[Math.floor(Math.random()*ideas.length)];$('videoGeneratorMsg').textContent='🎲 Idea lista.'}
async function generarVideo(){const p=$('videoPrompt').value.trim();if(!p)return $('videoGeneratorMsg').textContent='✍️ Escribe una idea.';$('generateVideoBtn').disabled=true;$('videoGeneratorMsg').textContent='🎬 Generando vídeo...';$('mediaResult').textContent='⏳ Creando MP4...';try{const d=await api('/api/video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});const url=d.url||d.videoUrl||d.video_url;if(!url)throw Error('El servidor no devolvió una URL de vídeo.');ultimoVideoUrl=url;const v=document.createElement('video');v.src=url;v.controls=true;v.playsInline=true;$('mediaResult').innerHTML='';$('mediaResult').appendChild(v);$('youtubeUploadBtn').disabled=!youtubeAccessToken;$('videoGeneratorMsg').textContent='✅ Vídeo creado.'}catch(e){$('mediaResult').textContent='❌ '+e.message;$('videoGeneratorMsg').textContent='❌ No se pudo generar.'}finally{$('generateVideoBtn').disabled=false}}

async function abrirPC(){const panel=$('pcPanel');panel.hidden=false;$('pcBtn').disabled=true;$('pcOut').textContent='💻 Iniciando PC digital...';try{const d=await api('/api/pc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'open'})});$('pcFrame').src=d.url;$('pcOut').textContent='✅ PC digital lista. Puedes usar el escritorio desde aquí.'}catch(e){$('pcOut').textContent='❌ '+e.message}finally{$('pcBtn').disabled=false}}
async function ejecutarPC(){const q=$('pcInstruction').value.trim();if(!q)return;
$('pcSendBtn').disabled=true;$('pcOut').textContent='🤖 Entendiendo la instrucción...';
try{
 const d=await api('/api/pc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'natural',command:q})});
 $('pcOut').textContent='🤖 Comando ejecutado: '+(d.command||'')+'\\n'+(d.output||'')+'\\nCódigo: '+d.exitCode;
}catch(e){$('pcOut').textContent='❌ '+e.message}finally{$('pcSendBtn').disabled=false}}
function refrescarPC(){const f=$('pcFrame');if(f.src)f.src=f.src}
async function crearMundo(){const prompt=$('worldPrompt').value.trim();if(!prompt)return $('worldMsg').textContent='✍️ Describe el mundo que quieres crear.';$('worldCreateBtn').disabled=true;$('worldMsg').textContent='🌍 Generando mundo...';try{const d=await api('/api/minecraft-world',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({edition:$('worldEdition').value,name:$('worldName').value.trim()||'Mundo SoyPerrito',seed:$('worldSeed').value.trim(),mode:$('worldMode').value,prompt})});if(!d.url)throw Error('El servidor no devolvió el archivo del mundo.');const a=document.createElement('a');a.href=d.url;a.download=d.filename||($('worldEdition').value==='bedrock'?'mundo.mcworld':'mundo.zip');a.textContent='⬇️ Descargar mundo';a.style.display='inline-block';a.style.marginTop='8px';$('worldMsg').innerHTML='✅ Mundo generado: ';$('worldMsg').appendChild(a)}catch(e){$('worldMsg').textContent='❌ '+e.message}finally{$('worldCreateBtn').disabled=false}}
async function crearImagen(){const p=prompt('¿Qué imagen quieres crear?');if(!p)return;$('imagenBtn').disabled=true;$('mediaResult').textContent='🖼️ Creando...';try{const img=await puter.ai.txt2img(p,{model:'gpt-image-2'});$('mediaResult').innerHTML='';$('mediaResult').appendChild(img)}catch(e){$('mediaResult').textContent='❌ No se pudo crear la imagen.'}finally{$('imagenBtn').disabled=false}}

function abrirOpenAI(){if(!usuarioActual)return msg('🔐 Inicia sesión primero.');$('openaiAppPanel').hidden=!$('openaiAppPanel').hidden}
async function crearOpenAI(){if(!usuarioActual)return $('openaiAppMsg').textContent='🔐 Inicia sesión primero.';const name=$('openaiAppName').value.trim()||'Mi App OpenAI',prompt=$('openaiAppPrompt').value.trim();if(!prompt)return $('openaiAppMsg').textContent='✍️ Describe la aplicación.';$('openaiCreateBtn').disabled=true;$('openaiDownloadBtn').disabled=true;$('openaiAppMsg').textContent='🤖 OpenAI está creando el código...';try{const d=await api('/api/create-openai-app',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,prompt})});ultimaOpenAIApp=d.code||'';$('openaiAppCode').value=ultimaOpenAIApp;$('openaiDownloadBtn').disabled=!ultimaOpenAIApp;$('openaiAppMsg').textContent='✅ Aplicación creada.'}catch(e){$('openaiAppMsg').textContent='❌ '+e.message}finally{$('openaiCreateBtn').disabled=false}}
function descargarOpenAI(){const code=$('openaiAppCode').value;if(!code)return;const n=(($('openaiAppName').value.trim()||'mi-app-openai').replace(/[^a-z0-9_-]/gi,'-').toLowerCase());const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code],{type:'text/html;charset=utf-8'}));a.download=n+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function conectarYouTube(){if(!usuarioActual)return $('youtubeMsg').textContent='🔐 Inicia sesión primero.';$('youtubeMsg').textContent='▶️ Abriendo autorización de YouTube...';try{youtubeClient=google.accounts.oauth2.initTokenClient({client_id:YOUTUBE_CLIENT_ID,scope:YOUTUBE_SCOPE,callback:r=>{if(r.error){$('youtubeMsg').textContent='❌ '+r.error;return}youtubeAccessToken=r.access_token;$('youtubeUploadBtn').disabled=!ultimoVideoUrl;$('youtubeMsg').textContent='✅ YouTube conectado. Ahora genera un vídeo y podrás subirlo.'}});youtubeClient.requestAccessToken({prompt:''})}catch(e){$('youtubeMsg').textContent='❌ No se pudo iniciar YouTube: '+e.message}}
async function subirYouTube(){if(!youtubeAccessToken)return $('youtubeMsg').textContent='🔐 Conecta YouTube primero.';if(!ultimoVideoUrl)return $('youtubeMsg').textContent='🎬 Genera primero un vídeo.';$('youtubeUploadBtn').disabled=true;$('youtubeMsg').textContent='⬆️ Preparando vídeo...';try{const media=await fetch(ultimoVideoUrl);if(!media.ok)throw Error('No se pudo descargar el vídeo generado.');const blob=await media.blob();const metadata={snippet:{title:$('youtubeTitle').value.trim()||'Vídeo de SoyPerritoProProYT',description:$('youtubeDescription').value.trim()||'Creado con SoyPerritoProProYT.IAOFICIAL'},status:{privacyStatus:$('youtubePrivacy').value}};const init=await fetch('https://www.googleapis.com/upload/youtube/v3/videos?part=snippet,status&uploadType=resumable',{method:'POST',headers:{Authorization:'Bearer '+youtubeAccessToken,'Content-Type':'application/json','X-Upload-Content-Type':blob.type||'video/mp4','X-Upload-Content-Length':String(blob.size)},body:JSON.stringify(metadata)});if(!init.ok)throw Error((await init.text())||'YouTube rechazó la preparación de la subida.');const location=init.headers.get('Location');if(!location)throw Error('YouTube no devolvió la URL de subida.');$('youtubeMsg').textContent='⬆️ Subiendo vídeo a YouTube...';const upload=await fetch(location,{method:'PUT',headers:{Authorization:'Bearer '+youtubeAccessToken,'Content-Type':blob.type||'video/mp4'},body:blob});const result=await upload.json().catch(()=>({}));if(!upload.ok)throw Error(result?.error?.message||'YouTube rechazó la subida.');$('youtubeMsg').textContent='✅ Vídeo subido. ID: '+(result.id||'desconocido')}catch(e){$('youtubeMsg').textContent='❌ '+e.message}finally{$('youtubeUploadBtn').disabled=!youtubeAccessToken||!ultimoVideoUrl}}

$('registerBtn').onclick=()=>auth('register');
$('loginBtn').onclick=()=>auth('login');
$('logoutBtn').onclick=cerrarSesion;
$('nuevoChatBtn').onclick=nuevo;
$('chatSelect').onchange=()=>{chatId=$('chatSelect').value;cargarActual()};
$('form').onsubmit=e=>{e.preventDefault();enviar()};
$('randomVideoBtn').onclick=generarIdea;
$('generateVideoBtn').onclick=generarVideo;
$('imagenBtn').onclick=crearImagen;$('worldBtn').onclick=()=>{$('worldPanel').hidden=!$('worldPanel').hidden};$('worldCreateBtn').onclick=crearMundo;
$('pcBtn').onclick=abrirPC;
$('pcSendBtn').onclick=ejecutarPC;
$('pcRefreshBtn').onclick=refrescarPC;
$('openaiAppBtn').onclick=abrirOpenAI;
$('openaiCreateBtn').onclick=crearOpenAI;
$('openaiDownloadBtn').onclick=descargarOpenAI;
$('youtubeConnectBtn').onclick=conectarYouTube;
$('youtubeUploadBtn').onclick=subirYouTube;

(function iniciar(){const u=safeGet('sp_session_v1','');if(u&&accounts()[u])activar(u);else{usuarioActual=null;nombreActual='Invitado';cargarChats();$('estado').textContent='💬 Modo invitado · puedes hablar sin cuenta'}})();
</script>
</body>
</html>
