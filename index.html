<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SoyPerritoProProYT.IAOFICIAL V0.0.8</title>

<style>
body {
    background-color: #0d1117;
    color: #c9d1d9;
    font-family: monospace;
    text-align: center;
    padding: 10px;
    margin: 0;
}

.box {
    border: 2px solid #238636;
    border-radius: 10px;
    padding: 15px;
    max-width: 420px;
    margin: 10px auto;
    background-color: #161b22;
    box-shadow: 0 0 12px rgba(35,134,54,.3);
}

h1 {
    color: #2ea043;
    font-size: 15px;
    margin: 5px 0;
}

.version {
    color: #8b949e;
    font-size: 11px;
    margin-bottom: 8px;
}

.estado {
    color: #d29922;
    font-size: 11px;
    margin-bottom: 10px;
}

.chat {
    background-color: #000;
    border: 1px solid #30363d;
    height: 180px;
    overflow-y: auto;
    text-align: left;
    padding: 10px;
    font-size: 12px;
    color: #58a6ff;
    margin-bottom: 10px;
    border-radius: 6px;
}

.input-bar {
    display: flex;
    gap: 5px;
    margin-bottom: 10px;
}

.txt {
    width: 73%;
    padding: 8px;
    background-color: #21262d;
    color: white;
    border: 1px solid #30363d;
    border-radius: 4px;
    font-size: 13px;
}

.btn {
    padding: 8px;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
}

.btn-green {
    background-color: #238636;
    width: 23%;
}

.grid-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 5px;
}

.btn-blue {
    background-color: #1f6feb;
}

.btn-purple {
    background-color: #8957e5;
}

.btn-red {
    background-color: #da3637;
}

.btn-orange {
    background-color: #d29922;
}

iframe {
    width: 100%;
    height: 150px;
    border-radius: 6px;
    border: 1px solid #30363d;
    margin-top: 8px;
    background-color: white;
}
</style>
</head>

<body>

<div class="box">

<h1>🐾 SoyPerritoProProYT.IAOFICIAL</h1>

<div class="version">
VERSION: 0.0.8 — IA LOCAL Q4 🧠
</div>

<div class="estado" id="estado">
🟡 Preparando cerebro...
</div>

<div class="chat" id="pantalla">

[SISTEMA] Nombre global:
SoyPerritoProProYT.IAOFICIAL
<br>

[SISTEMA] V0.0.8 iniciada.
<br>

[SISTEMA] Modelo local: SmolLM2-135M Q4
<br>

[IA] 🐶 Cargando mi cerebro...

</div>

<div class="input-bar">

<input
    type="text"
    id="entrada"
    class="txt"
    placeholder="Escribe algo..."
    autocomplete="off"
>

<button
    class="btn btn-green"
    onclick="enviar()">
Enviar
</button>

</div>

<div class="grid-buttons">

<button
    class="btn btn-blue"
    onclick="comandoBoton('jugar')">
🎮 BOTÓN JUGAR
</button>

<button
    class="btn btn-purple"
    onclick="comandoBoton('cuentas')">
🔐 CUENTAS JUEGOS
</button>

<button
    class="btn btn-red"
    onclick="comandoBoton('youtube')">
📺 VER YOUTUBE
</button>

<button
    class="btn btn-orange"
    onclick="comandoBoton('navegar')">
🌐 ENTRAR A WEBS
</button>

</div>

<div id="contenedor-web"></div>

</div>


<script type="module">

import {
    pipeline,
    env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

env.allowLocalModels = false;
env.useBrowserCache = true;

const pantalla =
    document.getElementById("pantalla");

const entrada =
    document.getElementById("entrada");

const estado =
    document.getElementById("estado");

const contenedorWeb =
    document.getElementById("contenedor-web");

let cerebro = null;
let cargando = false;


/* ==========================
   CARGAR IA Q4
========================== */

async function cargarIA() {

    if (cerebro || cargando)
        return;

    cargando = true;

    estado.textContent =
        "🟡 Descargando cerebro Q4...";

    try {

        cerebro = await pipeline(
            "text-generation",
            "HuggingFaceTB/SmolLM2-135M-Instruct",
            {
                dtype: "q4"
            }
        );

        estado.textContent =
            "🟢 IA Q4 LISTA";

        agregarIA(
            "¡Guau! 🐶 Mi cerebro Q4 está listo."
        );

    } catch (error) {

        console.error(error);

        estado.textContent =
            "🔴 Error cargando IA";

        agregarIA(
            "❌ No pude cargar mi cerebro. " +
            "Comprueba que tienes Internet " +
            "y un navegador compatible."
        );
    }

    cargando = false;
}


/* ==========================
   ENVIAR MENSAJE
========================== */

async function enviar() {

    const mensaje =
        entrada.value.trim();

    if (!mensaje)
        return;

    entrada.value = "";

    agregarUsuario(mensaje);

    if (!cerebro) {

        agregarIA(
            "🧠 Espera, estoy encendiendo mi cerebro..."
        );

        await cargarIA();

        if (!cerebro)
            return;
    }

    agregarIA("🧠 Pensando...");

    try {

        const mensajes = [

            {
                role: "system",
                content:
                "Eres SoyPerritoProProYT.IAOFICIAL V0.0.8. " +
                "Hablas español. Eres divertida, amable y gamer. " +
                "Puedes llamar jefe al usuario. " +
                "No inventes capacidades que no tienes."
            },

            {
                role: "user",
                content: mensaje
            }

        ];

        const resultado =
            await cerebro(mensajes, {

                max_new_tokens: 80,

                temperature: 0.7,

                do_sample: true

            });

        quitarPensando();

        let respuesta =
            resultado[0].generated_text;

        if (Array.isArray(respuesta)) {

            const ultimo =
                respuesta[respuesta.length - 1];

            if (ultimo &&
                ultimo.content) {

                respuesta =
                    ultimo.content;
            }
        }

        if (typeof respuesta !== "string") {

            respuesta =
                String(respuesta);
        }

        agregarIA(respuesta);

        hablar(respuesta);

    } catch (error) {

        console.error(error);

        quitarPensando();

        agregarIA(
            "❌ Mi cerebro Q4 tuvo un problema."
        );
    }
}


/* ==========================
   BOTONES
========================== */

function comandoBoton(tipo) {

    if (tipo === "jugar") {

        entrada.value =
            "¿A qué juegos podemos jugar?";

        enviar();

        return;
    }


    if (tipo === "cuentas") {

        entrada.value =
            "Explícame las cuentas de videojuegos.";

        enviar();

        return;
    }


    if (tipo === "youtube") {

        contenedorWeb.innerHTML =
            `<iframe
                src="https://www.youtube.com"
                allowfullscreen>
            </iframe>`;

        entrada.value =
            "Háblame de YouTube.";

        enviar();

        return;
    }


    if (tipo === "navegar") {

        contenedorWeb.innerHTML =
            `<iframe
                src="https://www.google.com">
            </iframe>`;

        entrada.value =
            "Quiero navegar por Internet.";

        enviar();
    }
}


/* ==========================
   MENSAJES
========================== */

function agregarUsuario(texto) {

    pantalla.innerHTML +=
        `<br>
        <span style="color:#fff;">
        👉 Tú: ${escapar(texto)}
        </span>`;

    pantalla.scrollTop =
        pantalla.scrollHeight;
}


function agregarIA(texto) {

    pantalla.innerHTML +=
        `<br>
        <span style="color:#2ea043;">
        🤖 IA: ${escapar(texto)}
        </span>`;

    pantalla.scrollTop =
        pantalla.scrollHeight;
}


function quitarPensando() {

    const spans =
        pantalla.querySelectorAll("span");

    for (const span of spans) {

        if (
            span.textContent ===
            "🤖 IA: 🧠 Pensando..."
        ) {

            span.parentElement.remove();

            break;
        }
    }
}


/* ==========================
   SEGURIDAD
========================== */

function escapar(texto) {

    return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ==========================
   VOZ
========================== */

function hablar(texto) {

    if (!("speechSynthesis" in window))
        return;

    window.speechSynthesis.cancel();

    const voz =
        new SpeechSynthesisUtterance(texto);

    voz.lang = "es-ES";

    voz.pitch = 1.5;

    voz.rate = 1.05;

    window.speechSynthesis.speak(voz);
}


/* ==========================
   ENTER
========================== */

entrada.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            enviar();

        }

    }
);


/* ==========================
   INICIAR
========================== */

cargarIA();

</script>

</body>
    </html>
