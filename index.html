<style>

body{

<script>
'use strict';

/* =========================
   VARIABLES
========================= */

const $ = id => document.getElementById(id);

let usuarioActual = null;
let nombreActual = '';
let chats = [];
let chatId = '';
let historial = [];

let youtubeAccessToken = null;

let ultimaOpenAIApp = '';

const YOUTUBE_CLIENT_ID =
  '954824229147-uf1pv1ch0v052lv0tutaueb1nknc7j19.apps.googleusercontent.com';

const YOUTUBE_SCOPE =
  'https://www.googleapis.com/auth/youtube.upload';


/* =========================
   UTILIDADES
========================= */

function msg(text, role = 'ai') {

  const element = document.createElement('div');

  element.className = 'msg ' + role;

  element.textContent = text;

  $('chat').appendChild(element);

  $('chat').scrollTop = $('chat').scrollHeight;

  return element;
}


function render() {

  $('chat').innerHTML = '';

  if (!historial.length) {

    msg(
      '¡Hola! 🐶 Tus chats se guardan automáticamente en este dispositivo.',
      'ai'
    );

  } else {

    historial.forEach(item => {

      msg(
        item.content,
        item.role === 'user' ? 'user' : 'ai'
      );

    });

  }

  $('chat').scrollTop = $('chat').scrollHeight;
}


function norm(value) {

  return String(value || '')
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9_.-]/g, '')
    .slice(0, 30);

}


async function api(url, options = {}) {

  const response = await fetch(url, options);

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {

    throw new Error(
      data.error || 'Error del servidor.'
    );

  }

  return data;
}


/* =========================
   LOCAL STORAGE
========================= */

function safeGet(key, fallback = null) {

  try {

    return localStorage.getItem(key) ?? fallback;

  } catch {

    return fallback;

  }

}


function safeSet(key, value) {

  try {

    localStorage.setItem(key, value);

    return true;

  } catch {

    return false;

  }

}


function safeRemove(key) {

  try {

    localStorage.removeItem(key);

    return true;

  } catch {

    return false;

  }

}


/* =========================
   CUENTAS
========================= */

function getAccounts() {

  try {

    const raw = safeGet('sp_accounts_v1', '');

    if (!raw) return {};

    const accounts = JSON.parse(raw);

    return (
      accounts &&
      typeof accounts === 'object' &&
      !Array.isArray(accounts)
    )
      ? accounts
      : {};

  } catch {

    return {};

  }

}


async function hashPassword(password) {

  const data =
    new TextEncoder().encode(password);

  if (globalThis.crypto?.subtle) {

    const hash =
      await crypto.subtle.digest(
        'SHA-256',
        data
      );

    return Array.from(
      new Uint8Array(hash)
    )
      .map(
        x => x.toString(16).padStart(2, '0')
      )
      .join('');

  }

  let hash = 2166136261;

  for (const byte of data) {

    hash ^= byte;

    hash = Math.imul(
      hash,
      16777619
    );

  }

  return 'fallback-' +
    (hash >>> 0).toString(16);

}


function saveAccounts(accounts) {

  if (
    !safeSet(
      'sp_accounts_v1',
      JSON.stringify(accounts)
    )
  ) {

    throw new Error(
      'El navegador no permite guardar cuentas en este dispositivo.'
    );

  }

}


async function auth(action) {

  $('authMsg').textContent = '';

  try {

    const username =
      norm($('userName').value);

    const password =
      $('userPass').value;

    if (username.length < 3) {

      $('authMsg').textContent =
        '❌ El usuario debe tener al menos 3 caracteres.';

      return;

    }

    if (password.length < 6) {

      $('authMsg').textContent =
        '❌ La contraseña debe tener al menos 6 caracteres.';

      return;

    }

    const accounts = getAccounts();

    const hash =
      await hashPassword(password);

    if (action === 'register') {

      if (accounts[username]) {

        $('authMsg').textContent =
          '❌ Ese nombre ya existe.';

        return;

      }

      accounts[username] = {
        hash,
        createdAt: Date.now()
      };

      saveAccounts(accounts);

    } else if (action === 'login') {

      if (
        !accounts[username] ||
        accounts[username].hash !== hash
      ) {

        $('authMsg').textContent =
          '❌ Nombre o contraseña incorrectos.';

        return;

      }

    }

    if (
      !safeSet(
        'sp_session_v1',
        username
      )
    ) {

      $('authMsg').textContent =
        '❌ No se pudo guardar la sesión.';

      return;

    }

    await activar(username);

  } catch (error) {

    $('authMsg').textContent =
      '❌ ' +
      (
        error?.message ||
        'No se pudo completar la operación.'
      );

  }

}


async function activar(username) {

  usuarioActual = username;

  nombreActual = username;

  $('userName').value = username;

  $('userName').disabled = true;

  $('userPass').value = '';

  $('registerBtn').hidden = true;

  $('loginBtn').hidden = true;

  $('logoutBtn').hidden = false;

  $('estado').textContent =
    '🟢 ' +
    username +
    ' · chats guardados';

  await cargarChats();

}


function cerrarSesion() {

  safeRemove('sp_session_v1');

  usuarioActual = null;

  nombreActual = '';

  chats = [];

  chatId = '';

  historial = [];

  $('userName').disabled = false;

  $('userName').value = '';

  $('userPass').value = '';

  $('registerBtn').hidden = false;

  $('loginBtn').hidden = false;

  $('logoutBtn').hidden = true;

  $('authMsg').textContent = '';

  $('estado').textContent =
    '🔐 Crea una cuenta o inicia sesión';

  $('chatSelect').innerHTML =
    '<option>💬 Inicia sesión para ver tus chats</option>';

  render();

}


/* =========================
   CHATS
========================= */

function chatKey() {

  return 'sp_chats_' +
    usuarioActual;

}


function loadLocalChats() {

  try {

    const data =
      JSON.parse(
        safeGet(chatKey(), '[]')
      );

    return Array.isArray(data)
      ? data
      : [];

  } catch {

    return [];

  }

}


function saveLocalChats() {

  safeSet(
    chatKey(),
    JSON.stringify(
      chats
        .slice(0, 30)
        .map(chat => ({
          id: chat.id,
          title: chat.title,
          messages:
            chat.messages.slice(-80)
        }))
    )
  );

}


async function cargarChats() {

  chats = loadLocalChats();

  if (!chats.length) {

    chats = [
      {
        id: 'chat-' + Date.now(),
        title: 'Nuevo chat',
        messages: []
      }
    ];

    saveLocalChats();

  }

  chatId = chats[0].id;

  selectChats();

  await cargarActual();

}


function selectChats() {

  $('chatSelect').innerHTML = '';

  chats.forEach(chat => {

    const option =
      document.createElement('option');

    option.value = chat.id;

    option.textContent =
      '💬 ' + chat.title;

    $('chatSelect')
      .appendChild(option);

  });

  $('chatSelect').value = chatId;

}


async function cargarActual() {

  const chat =
    chats.find(
      item => item.id === chatId
    );

  historial =
    Array.isArray(chat?.messages)
      ? chat.messages.slice(-80)
      : [];

  $('mediaResult').innerHTML = '';

  render();

}


function guardar() {

  const chat =
    chats.find(
      item => item.id === chatId
    );

  if (!chat) return;

  chat.messages =
    historial.slice(-80);

  const firstUserMessage =
    historial.find(
      item => item.role === 'user'
    );

  if (
    firstUserMessage &&
    chat.title === 'Nuevo chat'
  ) {

    chat.title =
      firstUserMessage.content
        .trim()
        .slice(0, 50) ||
      'Nuevo chat';

  }

  saveLocalChats();

  selectChats();

}


function nuevo() {

  if (!usuarioActual) {

    msg(
      '🔐 Inicia sesión primero.',
      'ai'
    );

    return;

  }

  const id =
    'chat-' + Date.now();

  chats.unshift({
    id,
    title: 'Nuevo chat',
    messages: []
  });

  chatId = id;

  historial = [];

  saveLocalChats();

  selectChats();

  render();

}


function comando(text) {

  if (text === '/ayuda') {

    return (
      '🐶 COMANDOS\n' +
      '/ayuda · /perfil · /juegos · /ajustes · /limpiar'
    );

  }

  if (text === '/perfil') {

    return (
      '👤 Usuario: ' +
      nombreActual +
      '\n💾 Chats: guardados en este dispositivo'
    );

  }

  if (text === '/juegos') {

    return (
      '🎮 Roblox · Fortnite · futuros proyectos'
    );

  }

  if (text === '/ajustes') {

    return (
      '⚙️ Cuenta y chats: sistema propio · IA: /api/chat'
    );

  }

  if (text === '/limpiar') {

    historial = [];

    guardar();

    render();

    return '🧹 Chat limpiado.';

  }

}


/* =========================
   CHAT IA
========================= */

async function enviar() {

  const text =
    $('entrada').value.trim();

  if (!text) return;

  if (!usuarioActual) {

    msg(
      '🔐 Inicia sesión primero.',
      'ai'
    );

    return;

  }

  if (/^@verifica\b/i.test(text)) {

    $('entrada').value = '';

    await verificarArchivo();

    return;

  }

  $('entrada').value = '';

  historial.push({
    role: 'user',
    content: text
  });

  render();

  guardar();

  const command =
    comando(text);

  if (command) {

    historial.push({
      role: 'assistant',
      content: command
    });

    render();

    guardar();

    return;

  }

  $('enviar').disabled = true;

  $('entrada').disabled = true;

  const answer =
    msg(
      'Escribiendo...',
      'ai'
    );

  try {

    const data =
      await api(
        '/api/chat',
        {
          method: 'POST',
          headers: {
            'Content-Type':
              'application/json'
          },
          body: JSON.stringify({
            message: text,
            history:
              historial.slice(-12)
          })
        }
      );

    answer.textContent =
      data.reply ||
      'Sin respuesta.';

    if (data.reply) {

      historial.push({
        role: 'assistant',
        content: data.reply
      });

    }

    guardar();

    $('estado').textContent =
      '🟢 ' +
      nombreActual +
      ' · chats guardados';

  } catch (error) {

    answer.textContent =
      '❌ ' +
      (
        error?.message ||
        'Error al conectar con la IA.'
      );

  } finally {
