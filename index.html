<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoyPerritoProProYT.IAOFICIAL</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .ia-box {
            border: 2px solid #238636;
            border-radius: 12px;
            padding: 20px;
            max-width: 450px;
            margin: 15px auto;
            background-color: #161b22;
            box-shadow: 0px 0px 15px rgba(35, 134, 54, 0.4);
        }
        h1 { color: #2ea043; font-size: 20px; margin-bottom: 5px; }
        .version { color: #8b949e; font-size: 12px; font-weight: bold; }
        
        .console {
            background-color: #000;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            text-align: left;
            font-size: 13px;
            height: 120px;
            overflow-y: auto;
            color: #58a6ff;
            margin: 15px 0;
        }

        select {
            background-color: #21262d;
            color: #fff;
            border: 1px solid #30363d;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            font-size: 15px;
            font-family: monospace;
            cursor: pointer;
        }

        .btn-ia {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 15px;
            width: 100%;
        }
        .btn-ia:hover { background-color: #2ea043; }
    </style>
</head>
<body>

    <div class="ia-box">
        <h1>🐾 SoyPerritoProProYT.IAOFICIAL</h1>
        <div class="version">MODELO GLOBAL: 0.0.1 (ALFA MULTIJUEGOS)</div>
        
        <hr style="border-color: #30363d; margin: 15px 0;">

        <label for="game-select" style="display:block; text-align:left; margin-bottom:5px; font-size:12px; color:#8b949e;">SELECCIONAR JUEGO EN ESPAÑA:</label>
        <select id="game-select" onchange="cambiarJuego()">
            <option value="Minecraft Bedrock">⛏️ Minecraft Bedrock (Módulo Inyección)</option>
            <option value="Minecraft Java">☕ Minecraft Java Edition (Bot Node.js)</option>
            <option value="Fortnite">🎯 Fortnite (Red Neuronal YOLO)</option>
            <option value="Roblox">🧱 Roblox (Scripts Lua)</option>
            <option value="Free Fire">🔥 Free Fire (Auto-Aim Script)</option>
            <option value="veck.io">🔫 veck.io / Venge.io (Canvas Hack)</option>
            <option value="bloxity.io">🌐 bloxity.io (Automatización Web)</option>
            <option value="40_mas">🎮 +40 Videojuegos Adicionales Activos</option>
        </select>

        <div class="console" id="log-console">
            [SISTEMA] Conexión establecida en España.<br>
            [SISTEMA] Esperando órdenes del dueño del canal...
        </div>

        <button class="btn-ia" onclick="conectarIA()">ACTIVAR AUTO-JUEGO</button>
    </div>

    <script>
        const consola = document.getElementById("log-console");

        function cambiarJuego() {
            const juego = document.getElementById("game-select").value;
            consola.innerHTML += `<br><span style="color:#e3b341;">[SISTEMA] Cargando base de datos para: ${juego}...</span>`;
            consola.scrollTop = consola.scrollHeight;
        }

        function conectarIA() {
            const juego = document.getElementById("game-select").value;
            consola.innerHTML += `<br><span style="color:#2ea043;">[CONEXIÓN] Buscando partida de ${juego}...</span>`;
            
            setTimeout(() => {
                consola.innerHTML += `<br><span style="color:#58a6ff;">[VISIÓN] Escaneando texturas en tiempo real...</span>`;
                consola.innerHTML += `<br><span style="color:#79c0ff;">[🎮 JUGANDO] SoyPerritoProProYT.IAOFICIAL ha tomado los mandos.</span>`;
                consola.scrollTop = consola.scrollHeight;
            }, 1000);
        }
    </script>

</body>
              </html>
