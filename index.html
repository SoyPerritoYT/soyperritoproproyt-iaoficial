<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoyPerritoProProYT.IAOFICIAL</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;display:flex;justify-content:center;min-height:100vh}.app{width:min(720px,100%);display:flex;flex-direction:column;height:100vh;background:#181818}.top{padding:18px;text-align:center;background:#242424;border-bottom:1px solid #333}.top h1{margin:0;font-size:22px}.status{font-size:13px;color:#aaa;margin-top:6px}.login{padding:18px 16px;text-align:center;background:#202020;border-bottom:1px solid #333}.google{border:0;border-radius:12px;padding:13px 20px;background:#fff;color:#111;font-weight:bold;cursor:pointer;font-size:15px}.google:disabled{opacity:.5}.error{color:#ff7d7d;font-size:12px;margin-top:8px;white-space:pre-wrap}.account{color:#fff;font-weight:bold;margin-top:10px}.welcome{color:#8cff9b;font-weight:bold;margin-top:6px}.owner{color:#ffd84d;font-weight:bold;margin-top:8px}.community{color:#7dc8ff;font-weight:bold;margin-top:8px}.chat{flex:1;overflow:auto;padding:16px}.msg{max-width:85%;padding:11px 14px;border-radius:14px;margin:8px 0;white-space:pre-wrap;line-height:1.4}.user{margin-left:auto;background:#315efb}.ai{margin-right:auto;background:#292929}.form{display:flex;gap:8px;padding:12px;background:#242424;border-top:1px solid #333}.form input{flex:1;padding:13px;border:0;border-radius:12px;background:#333;color:#fff;outline:0}.form button{border:0;border-radius:12px;padding:0 18px;background:#fff;color:#111;font-weight:bold;cursor:pointer}.form button:disabled{opacity:.5}.hint{text-align:center;color:#777;font-size:12px;padding-bottom:8px}
</style>
</head>
<body>
<div class="app">
<header class="top"><h1>🐶 SoyPerritoProProYT.IAOFICIAL</h1><div class="status" id="estado">🟢 Sin inicio de sesión · Chats no guardados</div></header>
<main class="chat" id="chat"></main>
<div class="hint">Comandos: /ayuda · /perfil · /juegos · /ajustes · /limpiar</div>
<form class="form" id="form"><input id="entrada" type="text" placeholder="Escribe algo..." autocomplete="off" maxlength="4000"><button id="enviar" type="submit">Enviar</button></form>
</div>
<script>
const chat=document.getElementById('chat'),entrada=document.getElementById('entrada'),form=document.getElementById('form'),enviarBtn=document.getElementById('enviar'),estado=document.getElementById('estado');
let historial=[];
function mensaje(texto,tipo){const el=document.createElement('div');el.className='msg '+tipo;el.textContent=texto;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}
function comando(t){
  if(t==='/ayuda')return '🐶 COMANDOS DE SOYPERRITOPROPROYT\n\n/ayuda — Ver comandos\n/perfil — Ver perfil\n/juegos — Ver proyectos\n/ajustes — Ver ajustes\n/limpiar — Borrar este chat';
  if(t==='/perfil')return '🐶 SOYPERRITOPROPROYT\n🤖 SoyPerritoProProYT.IAOFICIAL';
  if(t==='/juegos')return '🎮 PROYECTOS\n• SoyPerritoProProYT-IAOFICIAL\n• Tu futuro juego de Roblox\n• SoyPerritoProProYT-Console';
  if(t==='/ajustes')return '⚙️ AJUSTES\n• Inicio de sesión: No necesario\n• Chats: No se guardan\n• API de IA: /api/chat';
  if(t==='/limpiar'){historial=[];chat.innerHTML='';mensaje('🧹 Chat limpiado.','ai');return null}
  return null;
}
async function enviar(){
  const texto=entrada.value.trim();
  if(!texto)return;
  entrada.value='';
  mensaje(texto,'user');
  historial.push({role:'user',content:texto});
  const cmd=comando(texto);
  if(cmd){mensaje(cmd,'ai');historial.push({role:'assistant',content:cmd});return}
  enviarBtn.disabled=true;entrada.disabled=true;estado.textContent='Pensando...';
  const espera=mensaje('Escribiendo...','ai');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:texto,history:historial.slice(-12)})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(data.error||'No se pudo conectar con la API.');
    espera.textContent=data.reply||'La IA no devolvió una respuesta.';
    if(data.reply)historial.push({role:'assistant',content:data.reply});
    estado.textContent='🟢 IA lista · Chats no guardados';
  }catch(e){espera.textContent='❌ '+e.message;estado.textContent='🔴 API no disponible'}
  finally{enviarBtn.disabled=false;entrada.disabled=false;entrada.focus()}
}
form.addEventListener('submit',e=>{e.preventDefault();enviar()});
mensaje('¡Hola! 🐶 Soy SoyPerritoProProYT.IAOFICIAL. No necesitas iniciar sesión y los chats no se guardan. Escribe /ayuda para ver mis comandos.','ai');
</script>
</body>
</html>
