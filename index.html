<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SoyPerritoProProYT.IAOFICIAL V30.1.1</title>

<style>
body{
    background:#0d1117;
    color:#c9d1d9;
    font-family:monospace;
    text-align:center;
    padding:10px;
    margin:0;
}

.box{
    border:2px solid #238636;
    border-radius:10px;
    padding:15px;
    max-width:420px;
    margin:10px auto;
    background:#161b22;
    box-shadow:0 0 12px rgba(35,134,54,.3);
}

h1{
    color:#2ea043;
    font-size:15px;
    margin:5px 0;
}

.version{
    color:#8b949e;
    font-size:11px;
    margin-bottom:8px;
}

.estado{
    color:#2ea043;
    font-size:11px;
    margin-bottom:10px;
}

.chat{
    background:#000;
    border:1px solid #30363d;
    height:180px;
    overflow-y:auto;
    text-align:left;
    padding:10px;
    font-size:12px;
    color:#58a6ff;
    margin-bottom:10px;
    border-radius:6px;
}

.input-bar{
    display:flex;
    gap:5px;
    margin-bottom:10px;
}

.txt{
    width:73%;
    padding:8px;
    background:#21262d;
    color:white;
    border:1px solid #30363d;
    border-radius:4px;
    font-size:13px;
}

.btn{
    padding:8px;
    color:white;
    border:none;
    border-radius:4px;
    cursor:pointer;
    font-weight:bold;
    font-size:12px;
}

.btn-green{
    background:#238636;
    width:23%;
}

.grid-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:5px;
}

.btn-blue{
    background:#1f6feb;
}

.btn-purple{
    background:#8957e5;
}

.btn-red{
    background:#da3637;
}

.btn-orange{
    background:#d29922;
}

iframe{
    width:100%;
    height:300px;
    border-radius:6px;
    border:1px solid #30363d;
    margin-top:8px;
    background:white;
}
</style>
</head>

<body>

<div class="box">

<h1>🐾 SoyPerritoProProYT.IAOFICIAL</h1>

<div class="version">
VERSION: 30.1.1 — IA GAMER 🎮
</div>

<div class="estado" id="estado">
🟢 IA GAMER LISTA
</div>

<div class="chat" id="pantalla">

[SISTEMA] Nombre global:
SoyPerritoProProYT.IAOFICIAL
<br>

[SISTEMA] V30.1.1 iniciada.
<br>

[SISTEMA] Sistema gamer activado.
<br>

[IA] 🐶 ¡Guau! Estoy lista.

</div>

<div class="input-bar">

<input
    type="text"
    id="entrada"
    class="txt"
    placeholder="Escribe algo..."
    autocomplete="off"
>

<button
    class="btn btn-green"
    onclick="enviar()">
Enviar
</button>

</div>

<div class="grid-buttons">

<button
    class="btn btn-blue"
    onclick="comandoBoton('jugar')">
🎮 BOTÓN JUGAR
</button>

<button
    class="btn btn-purple"
    onclick="comandoBoton('cuentas')">
🔐 CUENTAS JUEGOS
</button>

<button
    class="btn btn-red"
    onclick="comandoBoton('youtube')">
📺 VER YOUTUBE
</button>

<button
    class="btn btn-orange"
    onclick="comandoBoton('navegar')">
🌐 ENTRAR A WEBS
</button>

</div>

<div id="contenedor-web"></div>

</div>


<script>

const pantalla =
document.getElementById("pantalla");

const entrada =
document.getElementById("entrada");

const contenedorWeb =
document.getElementById("contenedor-web");


/* =========================
   CHAT
========================= */

function agregarUsuario(texto){

    pantalla.innerHTML +=
    `<br>
    <span style="color:#fff;">
    👉 Tú: ${escapar(texto)}
    </span>`;

    pantalla.scrollTop =
    pantalla.scrollHeight;
}


function agregarIA(texto){

    pantalla.innerHTML +=
    `<br>
    <span style="color:#2ea043;">
    🤖 IA: ${escapar(texto)}
    </span>`;

    pantalla.scrollTop =
    pantalla.scrollHeight;

    hablar(texto);
}


/* =========================
   ENVIAR
========================= */

function enviar(){

    const mensaje =
    entrada.value.trim();

    if(!mensaje) return;

    entrada.value="";

    agregarUsuario(mensaje);

    const texto =
    mensaje.toLowerCase();


    if(
        texto.includes("veck") ||
        texto.includes("jugar")
    ){

        abrirVeck();

        return;
    }


    if(
        texto.includes("youtube") ||
        texto.includes("vídeo") ||
        texto.includes("video")
    ){

        abrirYoutube();

        return;
    }


    if(
        texto.includes("hola") ||
        texto.includes("buenas")
    ){

        agregarIA(
            "¡Guau guau! 🐶 Hola jefe. Soy la V30.1.1."
        );

        return;
    }


    agregarIA(
        "He recibido tu mensaje: " + mensaje
    );
}


/* =========================
   BOTONES
========================= */

function comandoBoton(tipo){

    if(tipo === "jugar"){

        abrirVeck();

        return;
    }


    if(tipo === "cuentas"){

        agregarIA(
            "🔐 Las cuentas de juegos todavía son una función simulada."
        );

        return;
    }


    if(tipo === "youtube"){

        abrirYoutube();

        return;
    }


    if(tipo === "navegar"){

        abrirWeb();

        return;
    }
}


/* =========================
   VECK.IO
========================= */

function abrirVeck(){

    agregarIA(
        "🎮 ¡Abriendo veck.io! 🐶"
    );

    window.open(
        "https://veck.io",
        "_blank"
    );
}


/* =========================
   YOUTUBE
========================= */

function abrirYoutube(){

    agregarIA(
        "📺 ¡Abriendo YouTube!"
    );

    window.open(
        "https://www.youtube.com",
        "_blank"
    );
}


/* =========================
   WEB
========================= */

function abrirWeb(){

    agregarIA(
        "🌐 ¡Abriendo Google!"
    );

    window.open(
        "https://www.google.com",
        "_blank"
    );
}


/* =========================
   VOZ
========================= */

function hablar(texto){

    if(!("speechSynthesis" in window))
        return;

    window.speechSynthesis.cancel();

    const voz =
    new SpeechSynthesisUtterance(texto);

    voz.lang="es-ES";
    voz.pitch=1.5;
    voz.rate=1.05;

    window.speechSynthesis.speak(voz);
}


/* =========================
   SEGURIDAD
========================= */

function escapar(texto){

    return String(texto)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   ENTER
========================= */

entrada.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Enter"){
            enviar();
        }

    }
);

</script>

</body>
    </html>
