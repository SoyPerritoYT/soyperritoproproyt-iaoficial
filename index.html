<style>
*{box-sizing:border-box}body{margin:0;background:#101012;color:#fff;font-family:Arial,sans-serif}.app{width:min(820px,100%);min-height:100vh;margin:auto;background:#18181b;display:flex;flex-direction:column}.top{padding:18px;text-align:center;background:#242428;border-bottom:1px solid #333}.top h1{margin:0;font-size:22px}.status{margin-top:6px;color:#aaa;font-size:13px}.auth{padding:12px;background:#202024;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #333}.auth input{flex:1;min-width:130px;padding:11px;border:0;border-radius:10px;background:#333;color:#fff}.auth button,.tools button,.chatbar button,.form button{border:0;border-radius:10px;padding:10px 14px;font-weight:bold;cursor:pointer}.auth button:disabled,.tools button:disabled{opacity:.5}.msginfo{width:100%;font-size:12px;color:#aaa;white-space:pre-wrap}.chatbar{display:flex;gap:8px;padding:10px;background:#202024;border-bottom:1px solid #333}.chatbar select{flex:1;min-width:0;padding:10px;border:0;border-radius:10px;background:#333;color:#fff}.chat{flex:1;min-height:280px;padding:16px;overflow:auto}.msg{max-width:85%;padding:11px 14px;margin:8px 0;border-radius:14px;white-space:pre-wrap;line-height:1.4}.user{margin-left:auto;background:#315efb}.ai{margin-right:auto;background:#29292e}.tools{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:10px 12px;background:#202024;border-top:1px solid #333}.tools input,.tools textarea,.tools select{padding:10px;border:0;border-radius:10px;background:#333;color:#fff}.tools textarea{flex:1;min-width:220px}.menu{width:100%;display:flex;justify-content:flex-end;gap:8px}.media{padding:14px;background:#111113;border-top:1px solid #333}.media img,.media video{display:block;max-width:100%;margin-left:auto;border-radius:12px}.media video{width:min(100%,720px);max-height:430px;background:#000}.videoInfo{text-align:right;color:#aaa;font-size:12px;margin-top:8px}#mediaStage img{max-width:100%;max-height:520px;object-fit:contain}#mediaStage video{width:100%;max-width:760px;max-height:520px;background:#000}#mediaControls button{border:0;border-radius:10px;padding:9px 12px;cursor:pointer}#mediaControls input[type=range]{accent-color:#fff}.youtubeLink{display:inline-block;margin-top:8px;padding:9px 12px;border-radius:10px;background:#fff;color:#111;text-decoration:none;font-weight:bold}.hint{text-align:center;color:#777;font-size:12px;padding:8px}.form{display:flex;gap:8px;padding:12px;background:#242428;border-top:1px solid #333}.form input{flex:1;min-width:0;padding:13px;border:0;border-radius:12px;background:#333;color:#fff}.form button{background:#fff;color:#111}@media(max-width:560px){.auth input,.auth button,.tools button,.tools input,.tools textarea,.tools select,.menu button{width:100%}.tools,.menu{justify-content:stretch}}
</style></head><body><div class="app">
<header class="top"><h1>🐶 SoyPerritoProProYT.IAOFICIAL</h1><div class="status" id="estado">🔐 Crea una cuenta o inicia sesión</div></header>

<div class="tools">

<script src="https://js.puter.com/v2/"></script><script src="https://accounts.google.com/gsi/client" async defer></script><script>
const $=id=>document.getElementById(id);let usuarioActual=null,nombreActual='',chats=[],chatId='',historial=[],youtubeAccessToken=null,githubConnected=false,githubPermission='read',githubLogin='';
const YOUTUBE_CLIENT_ID='954824229147-uf1pv1ch0v052lv0tutaueb1nknc7j19.apps.googleusercontent.com',YOUTUBE_SCOPE='https://www.googleapis.com/auth/youtube.upload';
const GITHUB_AUTH_URL='https://soy-perrito-pro-pro-yt-iaoficial-au.vercel.app';
const GITHUB_API_URL='https://soy-perrito-pro-pro-yt-iaoficial-au.vercel.app/api/github-file';
function initGithubSession(){
 const q=new URLSearchParams(location.search);
 const session=q.get('github_session');
 const login=q.get('github_login');
 if(session){githubSession=session;sessionStorage.setItem('sp_github_session',session);history.replaceState({},'',location.pathname)}
 else githubSession=sessionStorage.getItem('sp_github_session')||'';
 if(login){githubLogin=login;sessionStorage.setItem('sp_github_login',login)}
 else githubLogin=sessionStorage.getItem('sp_github_login')||'';
 actualizarGitHub();
}
async function actualizarGitHub(){
 if(!githubSession){$('githubStatus').textContent='⚪ GitHub no conectado.';$('githubMode').hidden=true;return}
 try{
  const r=await fetch(GITHUB_AUTH_URL+'/api/github-me',{headers:{Authorization:'Bearer '+githubSession}});
  const d=await r.json();
  if(!d.connected){throw Error('La conexión de GitHub ha caducado.')}
  githubConnected=true;githubPermission=d.permission||'read';githubLogin=d.login||githubLogin;
  $('githubStatus').textContent='🟢 GitHub: @'+githubLogin+(githubPermission==='write'?' · escritura activa':' · solo lectura');
  $('githubMode').hidden=false;
 }catch(e){
  githubConnected=false;githubSession='';sessionStorage.removeItem('sp_github_session');$('githubStatus').textContent='❌ '+e.message;
 }
}
function conectarGitHub(){window.location.href=GITHUB_AUTH_URL+'/api/github-auth?action=login&permission=write'}
async function githubLeerArchivo(path){
 if(!githubSession)throw Error('Conecta GitHub primero.');
 const r=await fetch(GITHUB_API_URL+'?path='+encodeURIComponent(path),{headers:{Authorization:'Bearer '+githubSession}});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'No se pudo leer el archivo.');return d;
}
async function githubGuardarArchivo(path,content,message){
 if(!githubSession)throw Error('Conecta GitHub primero.');
 const r=await fetch(GITHUB_API_URL,{method:'POST',headers:{Authorization:'Bearer '+githubSession,'Content-Type':'application/json'},body:JSON.stringify({path,content,message})});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'No se pudo guardar en GitHub.');return d;
}
function abrirModoGitHub(){if(!githubConnected||githubPermission!=='write')return conectarGitHub();$('githubMode').hidden=!$('githubMode').hidden;historial.push({role:'assistant',content:'🛠️ Modo GitHub activo para @'+githubLogin+'. Puedes leer y modificar archivos de tu repositorio.'});render();guardar()}
function msg(t,r){const e=document.createElement('div');e.className='msg '+r;e.textContent=t;$('chat').appendChild(e);return e}
function render(){const pos=$('chat').scrollTop;$('chat').innerHTML='';if(!historial.length){msg('¡Hola! 🐶 Tus chats se guardan automáticamente en este dispositivo.','ai')}else historial.forEach(m=>msg(m.content,m.role==='user'?'user':'ai'));$('chat').scrollTop=pos;requestAnimationFrame(()=>{$('chat').scrollTop=pos})}
function norm(v){return String(v||'').trim().toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,30)}
async function api(url,opt={}){const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error del servidor.');return d}
function getAccounts(){try{return JSON.parse(localStorage.getItem('sp_accounts_v1')||'{}')}catch{return {}}}
async function hashPassword(password){const data=new TextEncoder().encode(password),hash=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(hash)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function saveAccounts(a){localStorage.setItem('sp_accounts_v1',JSON.stringify(a))}
function chatKey(){return 'sp_chats_'+usuarioActual}
function loadLocalChats(){try{const d=JSON.parse(localStorage.getItem(chatKey())||'[]');return Array.isArray(d)?d:[]}catch{return []}}
function saveLocalChats(){localStorage.setItem(chatKey(),JSON.stringify(chats.slice(0,30).map(c=>({id:c.id,title:c.title,messages:c.messages.slice(-80)}))))}
async function auth(action){
 const u=norm($('userName').value),p=$('userPass').value;
 if(u.length<3)return $('authMsg').textContent='❌ El usuario debe tener al menos 3 caracteres.';
 if(p.length<6)return $('authMsg').textContent='❌ La contraseña debe tener al menos 6 caracteres.';
 const accounts=getAccounts(),hash=await hashPassword(p);
 if(action==='register'){if(accounts[u])return $('authMsg').textContent='❌ Ese nombre ya existe.';accounts[u]={hash};saveAccounts(accounts)}
 else if(action==='login'){if(!accounts[u]||accounts[u].hash!==hash)return $('authMsg').textContent='❌ Nombre o contraseña incorrectos.'}
 else return;
 localStorage.setItem('sp_session_v1',u);await activar(u)
}
async function activar(u){usuarioActual=u;nombreActual=u;$('userName').value=u;$('userName').disabled=true;$('userPass').value='';$('registerBtn').hidden=true;$('loginBtn').hidden=true;$('logoutBtn').hidden=false;$('authMsg').textContent='';$('estado').textContent='🟢 '+u+' · chats guardados';await cargarChats();}
function sesion(){const u=localStorage.getItem('sp_session_v1');if(u&&getAccounts()[u])activar(u);else render()}
function cargarChats(){
 chats=loadLocalChats();
 if(!chats.length){chats=[{id:'chat-'+Date.now(),title:'Nuevo chat',messages:[]}];saveLocalChats()}
 chatId=chats[0].id;selectChats();cargarActual()
}
function selectChats(){$('chatSelect').innerHTML='';chats.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent='💬 '+c.title;$('chatSelect').appendChild(o)});$('chatSelect').value=chatId}
async function cargarActual(){const c=chats.find(x=>x.id===chatId);historial=Array.isArray(c?.messages)?c.messages.slice(-80):[];$('mediaResult').innerHTML='';render()}
function guardar(){const c=chats.find(x=>x.id===chatId);if(!c)return;c.messages=historial.slice(-80);const first=historial.find(x=>x.role==='user');if(first&&c.title==='Nuevo chat')c.title=first.content.trim().slice(0,50)||'Nuevo chat';saveLocalChats();selectChats()}
function nuevo(){if(!usuarioActual)return msg('🔐 Inicia sesión primero.','ai');const id='chat-'+Date.now();chats.unshift({id,title:'Nuevo chat',messages:[]});chatId=id;historial=[];selectChats();render();saveLocalChats()}
function comando(t){if(t==='/ayuda')return'🐶 COMANDOS\n/ayuda · /perfil · /juegos · /ajustes · /limpiar';if(t==='/perfil')return'👤 Usuario: '+nombreActual+'\n💾 Chats: guardados en este dispositivo';if(t==='/juegos')return'🎮 Roblox · Fortnite · futuros proyectos';if(t==='/ajustes')return'⚙️ Cuenta y chats: sistema propio · IA: /api/chat';if(t==='/limpiar'){historial=[];guardar();render();return'🧹 Chat limpiado.'}}
async function verificarArchivo(){if(!usuarioActual)return msg('🔐 Inicia sesión primero.','ai');const input=$('archivoVerificar');input.value='';input.click();input.onchange=async()=>{const f=input.files?.[0];if(!f)return;if(f.size>523*1024*1024)return msg('❌ El archivo es demasiado grande. Máximo 523 MB.','ai');try{historial.push({role:'user',content:'@verifica este archivo: '+f.name});render();await guardar();const e=msg('🔎 Detectando tipo de '+f.name+'...','ai');const head=await f.slice(0,16).arrayBuffer(),b=new Uint8Array(head);const hex=Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join(' ');let tipo='archivo desconocido';if(b[0]===0x50&&b[1]===0x4b)tipo='ZIP/APK';else if(b[0]===0x25&&b[1]===0x50&&b[2]===0x44&&b[3]===0x46)tipo='PDF';else if(b[0]===0x89&&b[1]===0x50&&b[2]===0x4e&&b[3]===0x47)tipo='PNG';else if(b[0]===0xff&&b[1]===0xd8&&b[2]===0xff)tipo='JPEG';else if(b[0]===0x52&&b[1]===0x49&&b[2]===0x46&&b[3]===0x46)tipo='RIFF (WebP/AVI/WAV)';else if(b[0]===0x7f&&b[1]===0x45&&b[2]===0x4c&&b[3]===0x46)tipo='ELF';else if(b[0]===0x4d&&b[1]===0x5a)tipo='PE/EXE';else tipo='texto u otro formato';const sizeMB=(f.size/1024/1024).toFixed(2);const pedido='Eres el verificador de seguridad de SoyPerritoProProYT.IAOFICIAL. Analiza SOLO los datos que realmente recibas y NO inventes contenido.\n\nARCHIVO: '+f.name+'\nTAMAÑO: '+sizeMB+' MB\nTIPO DETECTADO POR CABECERA: '+tipo+'\nPRIMEROS BYTES (HEX): '+hex+'\n\nREGLAS IMPORTANTES:\n- Si es APK/ZIP/binario, NO afirmes que has inspeccionado AndroidManifest.xml, classes.dex, firma, permisos o el archivo completo si no se han recibido esos datos.\n- Si solo hay metadatos/cabecera, informa claramente: ANÁLISIS PARCIAL.\n- Nunca digas que un archivo es seguro al 100 %.\n- Explica qué se pudo comprobar y qué queda sin comprobar.\n- Si es un APK, indica que la cabecera ZIP es compatible con APK, pero que eso por sí solo no demuestra seguridad.\n- Si es texto/código, puedes analizar el contenido que se envíe y señalar errores o patrones sospechosos.\n\nDevuelve un informe breve con: estado (COMPLETO/PARCIAL), tipo, hallazgos, limitaciones y siguiente comprobación recomendada.';if(tipo==='texto u otro formato'&&f.size<=8*1024*1024){const text=await f.text();const d=await api('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:pedido+'\n\nCONTENIDO REAL DEL ARCHIVO:\n'+text})});e.textContent=d.reply||'No se pudo obtener un resultado.'}else{const d=await api('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:pedido})});e.textContent=d.reply||'No se pudo obtener un resultado.'}historial.push({role:'assistant',content:e.textContent});await guardar()}catch(x){msg('❌ No se pudo verificar el archivo: '+x.message,'ai')}}} async function enviar(){const t=$('entrada').value.trim();if(!t)return;if(!usuarioActual)return msg('🔐 Inicia sesión primero.','ai');if(/^@verifica\\b/i.test(t)){await verificarArchivo();$('entrada').value='';return}$('entrada').value='';historial.push({role:'user',content:t});render();await guardar();const c=comando(t);if(c){historial.push({role:'assistant',content:c});render();await guardar();return}$('enviar').disabled=true;$('entrada').disabled=true;const e=msg('Escribiendo...','ai');try{const d=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,history:historial.slice(-12)})});e.textContent=d.reply||'Sin respuesta.';if(d.reply)historial.push({role:'assistant',content:d.reply});await guardar();$('estado').textContent='🟢 '+nombreActual+' · chats guardados'}catch(x){e.textContent='❌ '+x.message}finally{$('enviar').disabled=false;$('entrada').disabled=false;}}
function mostrarMedia(el,tipo){const stage=$('mediaStage');stage.innerHTML='';$('mediaPlayer').hidden=false;if(tipo==='video'){el.controls=true;el.playsInline=true;el.autoplay=false;stage.appendChild(el);crearControlesVideo(el)}else{el.style.cursor='zoom-in';stage.appendChild(el);el.onclick=()=>el.style.maxWidth=el.style.maxWidth==='100%'?'180%':'100%';$('mediaControls').innerHTML='<span style="color:#aaa;font-size:12px">🖼️ Toca la imagen para ampliar/reducir.</span>'}}function crearControlesVideo(v){const c=$('mediaControls');c.innerHTML='';const b=document.createElement('button');b.textContent='▶️ / ⏸️';b.onclick=()=>v.paused?v.play():v.pause();const vol=document.createElement('input');vol.type='range';vol.min=0;vol.max=1;vol.step=.01;vol.value=v.volume;vol.title='Volumen';vol.oninput=()=>v.volume=Number(vol.value);const fs=document.createElement('button');fs.textContent='⛶ Pantalla completa';fs.onclick=()=>v.requestFullscreen?.();c.append(b,vol,fs)}async function crearImagen(){const p=prompt('¿Qué imagen quieres crear?');if(!p)return;$('imagenBtn').disabled=true;$('mediaResult').textContent='🖼️ Creando...';try{const img=await puter.ai.txt2img(p,{model:'gpt-image-2'});$('mediaResult').innerHTML='';$('mediaResult').appendChild(img);mostrarMedia(img,'image')}catch{$('mediaResult').textContent='❌ No se pudo crear la imagen.'}finally{$('imagenBtn').disabled=false}}

// ===== MODO GITHUB =====
let githubToken = sessionStorage.getItem('sp_github_token') || '';\nlet githubPermission = sessionStorage.getItem('sp_github_permission') || '';

function b64urlDecode(value){
  const normalized = value.replace(/-/g,'+').replace(/_/g,'/');
  const pad = normalized.length % 4 ? '='.repeat(4 - (normalized.length % 4)) : '';
  const bin = atob(normalized + pad);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function recibirSesionGitHub(){
  const raw = location.hash.startsWith('#github_token=') ? decodeURIComponent(location.hash.slice('#github_token='.length)) : '';
  if(!raw) return;
  const parts = raw.split('.');
  if(parts.length !== 2) return;
  try{
    const data = JSON.parse(b64urlDecode(parts[0]));
    if(!data.token || !data.exp || Date.now() > Number(data.exp)) return;
    githubToken = data.token;
    sessionStorage.setItem('sp_github_token', githubToken);\n    if(data.permission) { githubPermission=String(data.permission); sessionStorage.setItem('sp_github_permission', githubPermission); }
    history.replaceState(null,'',location.pathname + location.search);
  }catch{}
}

async function githubRequest(method='GET', body=null){
  const opt={method,headers:{Authorization:'Bearer '+githubToken}};
  if(body){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}
  return api('/api/github',opt);
}

async function actualizarEstadoGitHub(){
  if(!githubToken){
    $('githubStatus').textContent='🔐 GitHub no conectado. Pulsa “Modo GitHub” para autorizarlo.';
    return;
  }
  try{
    const d=await githubRequest('GET');
    $('githubStatus').textContent='✅ GitHub conectado como @'+d.login+' · puedes modificar archivos de este proyecto.';
  }catch(e){
    githubToken='';
    sessionStorage.removeItem('sp_github_token');
    $('githubStatus').textContent='🔐 La conexión de GitHub ha caducado. Vuelve a autorizarla.';
  }
}

function abrirModoGitHub(){
  $('githubMode').hidden=!$('githubMode').hidden;
  if(!$('githubMode').hidden){
    if(!githubToken) open('https://soy-perrito-pro-pro-yt-iaoficial-au.vercel.app/?return_to=main','_self');
    else actualizarEstadoGitHub();
  }
}

async function leerArchivoGitHub(){
  if(!githubToken) return $('githubMsg').textContent='🔐 Conecta GitHub primero.';
  const path=$('githubPath').value.trim();
  if(!path) return $('githubMsg').textContent='✍️ Escribe la ruta del archivo.';
  $('githubReadBtn').disabled=true;$('githubMsg').textContent='📖 Leyendo...';
  try{
    const d=await githubRequest('POST',{action:'read',path});
    $('githubContent').value=d.content||'';
    $('githubMsg').textContent='✅ Archivo leído: '+d.path;
  }catch(e){$('githubMsg').textContent='❌ '+e.message}
  finally{$('githubReadBtn').disabled=false}
}

async function guardarArchivoGitHub(){
  if(!githubToken) return $('githubMsg').textContent='🔐 Conecta GitHub primero.';
  const path=$('githubPath').value.trim(),content=$('githubContent').value;
  if(!path) return $('githubMsg').textContent='✍️ Escribe la ruta del archivo.';
  if(!content && !confirm('El contenido está vacío. ¿Quieres guardar un archivo vacío?')) return;
  $('githubWriteBtn').disabled=true;$('githubMsg').textContent='💾 Guardando en GitHub...';
  try{
    const d=await githubRequest('POST',{action:'write',path,content,message:$('githubMessage').value.trim()||'Update from SoyPerritoProProYT.IAOFICIAL'});
    $('githubMsg').textContent='✅ Cambios guardados en GitHub'+(d.commit_sha?' · commit '+d.commit_sha.slice(0,7):'')+'.';
  }catch(e){$('githubMsg').textContent='❌ '+e.message}
  finally{$('githubWriteBtn').disabled=false}
}

async function githubModeInit(){
  const hash=location.hash.startsWith('#github_token=')?decodeURIComponent(location.hash.slice('#github_token='.length)):'';
  if(hash){sessionStorage.setItem('sp_github_session',hash);history.replaceState(null,'',location.pathname+location.search);}
  const token=sessionStorage.getItem('sp_github_session');
  if(!token){$('githubMode').hidden=true;return;}
  try{
    const r=await fetch('https://soy-perrito-pro-pro-yt-iaoficial-au.vercel.app/api/github-session',{headers:{Authorization:'Bearer '+token}});
    const d=await r.json();
    if(!r.ok) throw Error(d.error||'Sesión de GitHub no válida.');
    $('githubMode').hidden=false;
    $('githubModeStatus').textContent='🐙 GitHub conectado: @'+d.login+(d.permission==='write'?' · ✏️ escritura':' · 👀 solo lectura');
    $('githubModeMsg').textContent=d.permission==='write'?'✅ Modo GitHub activado. Puedes modificar archivos de tu repo.':'👀 Conexión de solo lectura.';
  }catch(e){
    sessionStorage.removeItem('sp_github_session');
    $('githubMode').hidden=true;
    $('githubModeMsg').textContent='❌ '+e.message;
  }
}

  if(!path)return $('githubModeMsg').textContent='✍️ Escribe la ruta del archivo.';
  $('githubSave').disabled=true;$('githubModeMsg').textContent='⏳ Guardando en GitHub...';
  try{
    const r=await fetch('https://soy-perrito-pro-pro-yt-iaoficial-au.vercel.app/api/github-file',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({path,content,message})});

}
