<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Mini Bedrock IA</title>
<style>
html,body{
 margin:0;
 overflow:hidden;
 background:#87ceeb;
 font-family:Arial;
 touch-action:none;
}
canvas{display:block}

#chat{
 position:fixed;
 left:10px;
 right:10px;
 bottom:80px;
 z-index:10;
 display:flex;
 gap:5px;
}

#msg{
 flex:1;
 font-size:17px;
 padding:12px;
 border-radius:10px;
 border:2px solid #333;
}

button{
 font-size:18px;
 padding:10px 14px;
 border:0;
 border-radius:10px;
 background:white;
}

#info{
 position:fixed;
 top:8px;
 left:8px;
 z-index:10;
 background:#0009;
 color:white;
 padding:8px;
 border-radius:8px;
}
</style>
</head>

<body>

<div id="info">
🧱 Mini Bedrock IA<br>
🤖 SoyPerritoProProYT.IaOFICIAL
</div>

<canvas id="game"></canvas>

<div id="chat">
<input id="msg" placeholder="Habla con tu IA...">
<button onclick="send()">Enviar</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
 canvas.width=innerWidth;
 canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

const TILE=40;
const W=100;
const H=25;

let world=[];

for(let y=0;y<H;y++){
 world[y]=[];
 for(let x=0;x<W;x++){
  if(y>15) world[y][x]=2;
  else if(y===15) world[y][x]=1;
  else world[y][x]=0;
 }
}

let player={
 x:8,y:10,vx:0,vy:0,
 w:.75,h:1.8,
 onGround:false
};

let ai={
 x:4,y:10,vx:0,vy:0,
 w:.75,h:1.8,
 onGround:false,
 mode:"stop"
};

let cameraX=0;

function solid(x,y){
 if(x<0||x>=W||y<0||y>=H)return true;
 return world[y][x]!==0;
}

function physics(o){

 o.vy+=0.025;

 o.x+=o.vx;

 if(solid(Math.floor(o.x),Math.floor(o.y+o.h))){
  o.x-=o.vx;
  o.vx=0;
 }

 o.y+=o.vy;

 if(solid(Math.floor(o.x),Math.floor(o.y+o.h))){
  o.y=Math.floor(o.y+o.h)-o.h;
  o.vy=0;
  o.onGround=true;
 }else{
  o.onGround=false;
 }

}

function aiThink(){

 if(ai.mode==="follow"){

  let dx=player.x-ai.x;

  if(Math.abs(dx)>1){
   ai.vx=dx>0?.07:-.07;
  }else{
   ai.vx=0;
  }

  if(ai.onGround &&
     Math.abs(player.y-ai.y)>1 &&
     Math.random()<.04){
   ai.vy=-.48;
  }
 }

 if(ai.mode==="jump"){
  if(ai.onGround) ai.vy=-.48;
 }

}

function build(){

 let bx=Math.floor(ai.x)+1;
 let by=15;

 if(bx>=0&&bx<W&&world[by][bx]===0){
  world[by][bx]=1;
 }

}

function breakBlock(){

 let bx=Math.floor(ai.x)+1;
 let by=Math.floor(ai.y+1);

 if(bx>=0&&bx<W&&by>=0&&by<H){
  world[by][bx]=0;
 }

}

function command(text){

 text=text.toLowerCase();

 if(
  text.includes("sígueme")||
  text.includes("sigueme")||
  text.includes("ven")||
  text.includes("conmigo")
 ){
  ai.mode="follow";
  return "🤖 Vale, te sigo.";
 }

 if(text.includes("para")||text.includes("quieto")){
  ai.mode="stop";
  ai.vx=0;
  return "🤖 Me quedo quieta.";
 }

 if(text.includes("salta")){
  ai.mode="jump";
  return "🤖 ¡Saltando!";
 }

 if(
  text.includes("construye")||
  text.includes("construir")||
  text.includes("casa")
 ){
  build();
  return "🤖 He colocado un bloque.";
 }

 if(
  text.includes("rompe")||
  text.includes("romper")
 ){
  breakBlock();
  return "🤖 He roto el bloque.";
 }

 if(text.includes("hola")){
  return "🤖 ¡Hola! 😎";
 }

 return "🤖 No entiendo esa orden todavía.";
}

function send(){

 let input=document.getElementById("msg");
 let text=input.value.trim();

 if(!text)return;

 let answer=command(text);

 document.getElementById("info").innerHTML=
 "🧱 Mini Bedrock IA<br>"+
 "🤖 "+answer;

 input.value="";
}

document.getElementById("msg").addEventListener(
 "keydown",
 e=>{
  if(e.key==="Enter")send();
 }
);

function drawBlock(type,x,y){

 if(type===1)ctx.fillStyle="#55aa35";
 if(type===2)ctx.fillStyle="#795548";

 ctx.fillRect(x,y,TILE,TILE);

 ctx.strokeStyle="#0002";
 ctx.strokeRect(x,y,TILE,TILE);
}

function draw(){

 ctx.clearRect(0,0,canvas.width,canvas.height);

 cameraX=player.x*TILE-canvas.width/2;

 cameraX=Math.max(
  0,
  Math.min(cameraX,W*TILE-canvas.width)
 );

 for(let y=0;y<H;y++){
  for(let x=0;x<W;x++){

   if(world[y][x]){
    drawBlock(
     world[y][x],
     x*TILE-cameraX,
     y*TILE
    );
   }

  }
 }

 // IA
 ctx.fillStyle="#9b59ff";

 ctx.fillRect(
  ai.x*TILE-cameraX,
  ai.y*TILE,
  ai.w*TILE,
  ai.h*TILE
 );

 ctx.fillStyle="white";
 ctx.font="14px Arial";

 ctx.fillText(
  "🤖 IA",
  ai.x*TILE-cameraX-5,
  ai.y*TILE-5
 );

 // jugador
 ctx.fillStyle="#3498db";

 ctx.fillRect(
  player.x*TILE-cameraX,
  player.y*TILE,
  player.w*TILE,
  player.h*TILE
 );

}

function loop(){

 aiThink();

 physics(player);
 physics(ai);

 draw();

 requestAnimationFrame(loop);
}

loop();

</script>

</body>
    </html>
