<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoyPerritoProProYT.IAOFICIAL</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;display:flex;justify-content:center;min-height:100vh}.app{width:min(720px,100%);display:flex;flex-direction:column;height:100vh;background:#181818}.top{padding:18px;text-align:center;background:#242424;border-bottom:1px solid #333}.top h1{margin:0;font-size:22px}.status{font-size:13px;color:#aaa;margin-top:6px}.login{padding:12px 16px;text-align:center;background:#202020;border-bottom:1px solid #333}.login button{border:0;border-radius:10px;padding:11px 14px;background:#fff;color:#111;font-weight:bold;cursor:pointer;margin:3px}.owner{color:#ffd84d;font-weight:bold;margin-top:6px}.chat{flex:1;overflow:auto;padding:16px}.msg{max-width:85%;padding:11px 14px;border-radius:14px;margin:8px 0;white-space:pre-wrap;line-height:1.4}.user{margin-left:auto;background:#315efb}.ai{margin-right:auto;background:#292929}.form{display:flex;gap:8px;padding:12px;background:#242424;border-top:1px solid #333}.form input{flex:1;padding:13px;border:0;border-radius:12px;background:#333;color:#fff;outline:0}.form button{border:0;border-radius:12px;padding:0 18px;background:#fff;color:#111;font-weight:bold;cursor:pointer}.form button:disabled{opacity:.5}.hint{text-align:center;color:#777;font-size:12px;padding-bottom:8px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>🐶 SoyPerritoProProYT.IAOFICIAL</h1>
    <div class="status" id="estado">Inicia sesión con Google para activar tu modo dueño</div>
  </header>
  <div class="login">
    <button type="button" id="loginBtn">🔐 Continuar con Google</button>
    <button type="button" id="logoutBtn" hidden>🚪 Salir</button>
    <div id="ownerBadge"></div>
  </div>
  <main class="chat" id="chat"></main>
  <div class="hint">Comandos: /ayuda · /perfil · /juegos · /ajustes · /limpiar</div>
  <form class="form" id="form">
    <input id="entrada" type="text" placeholder="Escribe algo..." autocomplete="off" maxlength="4000">
    <button id="enviar" type="submit">Enviar</button>
  </form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyAQClDYCVK7I1o@DMDKLCmKApS_Dy7cNw",
  authDomain:"soyperritopropryt-iaoficial.firebaseapp.com",
  projectId:"soyperritopropryt-iaoficial",
  storageBucket:"soyperritopropryt-iaoficial.firebasestorage.app",
  messagingSenderId:"964674229147",
  appId:"1:964674229147:web:b6313429946d8a2f493be"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();

const chat=document.getElementById('chat'),entrada=document.getElementById('entrada'),form=document.getElementById('form'),enviarBtn=document.getElementById('enviar'),estado=document.getElementById('estado');
const loginBtn=document.getElementById('loginBtn'),logoutBtn=document.getElementById('logoutBtn'),ownerBadge=document.getElementById('ownerBadge');
let historial=[];
let usuarioActual=null;

function mensaje(texto,tipo){const el=document.createElement('div');el.className='msg '+tipo;el.textContent=texto;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el;}
function renderHistorial(){chat.innerHTML='';if(!historial.length)mensaje('¡Hola! 🐶 Soy tu IA. Tus chats se guardarán online con Firebase. Escribe /ayuda para ver mis comandos.','ai');for(const m of historial)mensaje(m.content,m.role==='user'?'user':'ai');}

async function cargarChat(uid){
  try{
    const ref=doc(db,'users',uid,'chats','principal');
    const snap=await getDoc(ref);
    historial=snap.exists()&&Array.isArray(snap.data().messages)?snap.data().messages:[];
  }catch(e){historial=[];console.error(e);}
  renderHistorial();
}

async function guardarChat(){
  if(!usuarioActual)return;
  try{
    const ref=doc(db,'users',usuarioActual.uid,'chats','principal');
    await setDoc(ref,{messages:historial.slice(-80),updatedAt:serverTimestamp()},{merge:true});
  }catch(e){console.error('Error guardando chat:',e);estado.textContent='⚠️ No se pudo guardar el chat';}
}

async function guardarPerfil(uid,user){
  try{
    await setDoc(doc(db,'users',uid,'profile','info'),{displayName:'SoyPerritoProProYT',email:user.email||'',photoURL:user.photoURL||'',updatedAt:serverTimestamp()},{merge:true});
  }catch(e){console.error('Error guardando perfil:',e);}
}

async function iniciar(){
  loginBtn.disabled=true;
  estado.textContent='🔄 Redirigiendo a Google...';
  try{
    await signInWithRedirect(auth,provider);
  }catch(e){
    const errores={
      'auth/unauthorized-domain':'Este dominio no está autorizado en Firebase Authentication.',
      'auth/operation-not-allowed':'El inicio de sesión con Google no está activado en Firebase Authentication.'
    };
    alert(errores[e.code]||('No se pudo iniciar sesión con Google: '+e.message));
    loginBtn.disabled=false;
    estado.textContent='Inicia sesión con Google para activar tu modo dueño';
  }
}

async function comprobarRedireccion(){
  try{
    await getRedirectResult(auth);
  }catch(e){
    const errores={
      'auth/unauthorized-domain':'Este dominio no está autorizado en Firebase Authentication.',
      'auth/operation-not-allowed':'El inicio de sesión con Google no está activado en Firebase Authentication.',
      'auth/popup-blocked':'El navegador bloqueó el inicio de sesión.'
    };
    console.error('Error en redirección de Google:',e);
    estado.textContent=errores[e.code]||'No se pudo completar el inicio de sesión con Google.';
    alert(errores[e.code]||('No se pudo iniciar sesión con Google: '+e.message));
  }
}

function activar(user){
  usuarioActual=user;
  loginBtn.hidden=true;
  logoutBtn.hidden=false;
  ownerBadge.innerHTML='<div class="owner">👑 MODO DUEÑO ACTIVADO · SoyPerritoProProYT</div>';
  estado.textContent='👑 Google conectado · Firebase conectado';
  entrada.focus();
}

async function salir(){
  await signOut(auth);
  usuarioActual=null;
  historial=[];
  loginBtn.hidden=false;
  logoutBtn.hidden=true;
  ownerBadge.textContent='';
  estado.textContent='Inicia sesión con Google para activar tu modo dueño';
  renderHistorial();
}

function comando(t){
  if(t==='/ayuda')return '🐶 COMANDOS DE SOYPERRITOPROPROYT\n\n/ayuda — Ver comandos\n/perfil — Ver tu perfil\n/juegos — Ver tus proyectos\n/ajustes — Ver ajustes\n/limpiar — Borrar el chat guardado online';
  if(t==='/perfil')return '👑 PERFIL\nUsuario: SoyPerritoProProYT\nRol: Dueño\nEstado: conectado con Firebase';
  if(t==='/juegos')return '🎮 PROYECTOS\n• SoyPerritoProProYT-IAOFICIAL\n• Tu futuro juego de Roblox\n• SoyPerritoProProYT-Console';
  if(t==='/ajustes')return '⚙️ AJUSTES\n• Cuenta: Google + Firebase Authentication\n• Chats: Firestore online\n• API de IA: /api/chat';
  if(t==='/limpiar'){historial=[];guardarChat();renderHistorial();return '🧹 Chat limpiado y actualizado en Firestore.';}
  return null;
}

loginBtn.addEventListener('click',iniciar);
logoutBtn.addEventListener('click',salir);

onAuthStateChanged(auth,async user=>{
  if(user){
    activar(user);
    await guardarPerfil(user.uid,user);
    await cargarChat(user.uid);
  }else{
    usuarioActual=null;
    historial=[];
    renderHistorial();
  }
});

comprobarRedireccion();

async function enviar(){
  const texto=entrada.value.trim();
  if(!texto)return;
  if(!usuarioActual){mensaje('🔐 Inicia sesión con Google para usar la IA y guardar chats online.','ai');return;}
  entrada.value='';
  mensaje(texto,'user');
  historial.push({role:'user',content:texto});
  await guardarChat();

  const cmd=comando(texto);
  if(cmd){mensaje(cmd,'ai');historial.push({role:'assistant',content:cmd});await guardarChat();return;}

  enviarBtn.disabled=true;entrada.disabled=true;estado.textContent='Pensando...';
  const espera=mensaje('Escribiendo...','ai');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:texto,history:historial.slice(-12)})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(data.error||'No se pudo conectar con la API.');
    espera.textContent=data.reply||'La IA no devolvió una respuesta.';
    if(data.reply)historial.push({role:'assistant',content:data.reply});
    await guardarChat();
    estado.textContent='👑 Firebase + API conectados';
  }catch(e){
    espera.textContent='❌ '+e.message;
    estado.textContent='API no disponible';
    await guardarChat();
  }finally{
    enviarBtn.disabled=false;entrada.disabled=false;entrada.focus();
  }
}

form.addEventListener('submit',e=>{e.preventDefault();enviar();});
renderHistorial();
</script>
</body>
</html>
