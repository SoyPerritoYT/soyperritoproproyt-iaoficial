<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoyPerritoProProYT.IAOFICIAL 0.0.4</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .ia-box {
            border: 2px solid #238636;
            border-radius: 12px;
            padding: 20px;
            max-width: 450px;
            margin: 15px auto;
            background-color: #161b22;
            box-shadow: 0px 0px 15px rgba(35, 134, 54, 0.4);
        }
        h1 { color: #2ea043; font-size: 20px; margin-bottom: 5px; }
        .version { color: #8b949e; font-size: 12px; font-weight: bold; }
        
        .chat-container {
            background-color: #000;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            text-align: left;
            font-size: 13px;
            height: 150px;
            overflow-y: auto;
            color: #58a6ff;
            margin: 15px 0;
        }
        .input-chat {
            width: 50%;
            padding: 10px;
            background-color: #21262d;
            color: white;
            border: 1px solid #30363d;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-send {
            width: 20%;
            padding: 10px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-mic {
            width: 22%;
            padding: 10px;
            background-color: #da3637;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="ia-box">
        <h1>🐾 SoyPerritoProProYT.IAOFICIAL</h1>
        <div class="version">VERSION: 0.0.4 (MÓDULO DE VOZ Y RESPUESTAS)</div>
        
        <hr style="border-color: #30363d; margin: 15px 0;">

        <div class="chat-container" id="chat-box">
            <span style="color:#8b949e;">[SISTEMA] Modulador perruno listo en España...</span><br>
            <span style="color:#2ea043;">[IA] ¡Guau! Hola jefe, pulsa el botón de VOZ y háblame en español.🐾</span>
        </div>

        <div style="text-align: left; display: flex; justify-content: space-between;">
            <input type="text" id="user-input" class="input-chat" placeholder="Escribe o habla...">
            <button class="btn-mic" onclick="activarMicrofono()">🎙️ VOZ</button>
            <button class="btn-send" onclick="hablarConIA()">Enviar</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");

        function activarMicrofono() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) {
                alert("Usa Google Chrome en tu tablet para el reconocimiento de voz.");
                return;
            }

            const recognition = new window.SpeechRecognition();
            recognition.lang = 'es-ES';
            chatBox.innerHTML += `<br><span style="color:#da3637;">[ESCUCHANDO...] ¡Dime algo, guau!</span>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            recognition.start();

            recognition.onresult = function(event) {
                const textoEscuchado = event.results[0][0].transcript;
                document.getElementById("user-input").value = textoEscuchado;
                hablarConIA();
            };
        }

        function hablarConIA() {
            const input = document.getElementById("user-input");
            const mensaje = input.value.trim();
            if (mensaje === "") return;

            chatBox.innerHTML += `<br><span style="color:#ffffff;">👉 Tú: ${mensaje}</span>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                let respuestaIA = "¡Guau! No he entendido bien ese comando perruno, jefe.";
                const textoMin = mensaje.toLowerCase();

                if (textoMin.includes("hola") || textoMin.includes("buenas")) {
                    respuestaIA = "¡Guau guau! Hola jefe Perrito, estoy listo para el Minecraft en España.";
                } else if (textoMin.includes("jugar") || textoMin.includes("juego")) {
                    respuestaIA = "¡Suelto el hueso y me meto a la partida de inmediato! Vamos a ganar.";
                } else if (textoMin.includes("crack") || textoMin.includes("mejor")) {
                    respuestaIA = "¡Claro! Los dos somos los mejores de internet. ¡ChatGPT se queda atrás!";
                } else if (textoMin.includes("habla") || textoMin.includes("español")) {
                    respuestaIA = "¡Hablo en perfecto español con mi acento de cachorro robótico!";
                }

                chatBox.innerHTML += `<br><span style="color:#2ea043;">🤖 IA: ${respuestaIA}</span>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                
                const vozPerrito = new SpeechSynthesisUtterance(respuestaIA);
                vozPerrito.lang = 'es-ES';
                vozPerrito.pitch = 1.6;
                vozPerrito.rate = 1.1;
                window.speechSynthesis.speak(vozPerrito);

            }, 800);
        }
    </script>

</body>
</html>
