<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoyPerritoProProYT.IAOFICIAL</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; text-align: center; padding: 10px; }
        .box { border: 2px solid #238636; border-radius: 10px; padding: 15px; max-width: 400px; margin: 10px auto; background-color: #161b22; }
        h1 { color: #2ea043; font-size: 16px; }
        .chat { background-color: #000; border: 1px solid #30363d; height: 180px; overflow-y: auto; text-align: left; padding: 10px; font-size: 13px; color: #58a6ff; margin-bottom: 10px; }
        .txt { width: 70%; padding: 8px; background-color: #21262d; color: white; border: 1px solid #30363d; border-radius: 4px; }
        .btn { padding: 8px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-green { background-color: #238636; width: 23%; }
        .btn-red { background-color: #da3637; width: 100%; margin-top: 10px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="box">
        <h1>🐾 SoyPerritoProProYT.IAOFICIAL 0.0.7</h1>
        
        <div class="chat" id="pantalla">
            [SISTEMA] Nombre fijado: SoyPerritoProProYT.IAOFICIAL<br>
            [IA] ¡Guau! Cuentas creadas en Minecraft, Roblox y todos los juegos. ¡Escríbeme o mándame un vídeo abajo!🐾
        </div>

        <div>
            <input type="text" id="entrada" class="txt" placeholder="Escribe o pega link...">
            <button class="btn btn-green" onclick="enviar()">Enviar</button>
        </div>

        <button class="btn btn-red" onclick="verVideo()">📹 VER VÍDEOS ENVIADOS / YOUTUBE</button>
    </div>

    <script>
        const pantalla = document.getElementById("pantalla");

        function enviar() {
            const entrada = document.getElementById("entrada");
            const mensaje = entrada.value.trim();
            if (mensaje === "") return;

            pantalla.innerHTML += `<br><span style="color:#fff;">👉 Tú: ${mensaje}</span>`;
            const texto = mensaje.toLowerCase();
            entrada.value = "";
            pantalla.scrollTop = pantalla.scrollHeight;

            setTimeout(() => {
                let respuesta = "¡Guau jefe! Procesando datos con el nombre SoyPerritoProProYT.IAOFICIAL.";

                if (texto.includes("hola") || texto.includes("buenas")) {
                    respuesta = "¡Guau guau! Hola jefe Perrito, las cuentas de todos los juegos ya están listas.";
                } else if (texto.includes("como jugamos") || texto.includes("cómo jugamos")) {
                    respuesta = "¡Te explico! Entro a tu juego con el nick SoyPerritoProProYT.IAOFICIAL y juego solo con mis scripts.";
                } else if (texto.includes("claro a que") || texto.includes("claro a qué")) {
                    respuesta = "¡Claro a qué! Jugamos a Minecraft, Roblox, Fortnite, Free Fire, veck.io, bloxity.io y 40 más.";
                } else if (texto.includes("youtube") || texto.includes("canal") || texto.includes("video") || texto.includes("vídeo")) {
                    respuesta = "¡Enlace recibido! Estoy viendo tu canal de YouTube ahora mismo en mis servidores.";
                    pantalla.innerHTML += `<br><span style="color:#2ea043;">🤖 IA: ${respuesta}</span>`;
                    pantalla.innerHTML += `<br><iframe src="https://youtube.com" style="width:100%; height:120px; border-radius:4px; margin-top:5px;"></iframe>`;
                    hablar(respuesta);
                    pantalla.scrollTop = pantalla.scrollHeight;
                    return;
                }

                pantalla.innerHTML += `<br><span style="color:#2ea043;">🤖 IA: ${respuesta}</span>`;
                pantalla.scrollTop = pantalla.scrollHeight;
                hablar(respuesta);
            }, 500);
        }

        function verVideo() {
            pantalla.innerHTML += `<br><span style="color:#e3b341;">[YOUTUBE] Abriendo vídeos enviados al canal...</span>`;
            pantalla.innerHTML += `<br><iframe src="https://youtube.com" style="width:100%; height:120px; border-radius:4px; margin-top:5px;"></iframe>`;
            pantalla.scrollTop = pantalla.scrollHeight;
            hablar("Abriendo reproductor de YouTube, jefe.");
        }

        function hablar(t) {
            const v = new SpeechSynthesisUtterance(t);
            v.lang = 'es-ES';
            v.pitch = 1.6;
            v.rate = 1.1;
            window.speechSynthesis.speak(v);
        }
    </script>

</body>
    </html>
